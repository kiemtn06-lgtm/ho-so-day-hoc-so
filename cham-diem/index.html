async function adminCall(payload){
  const r = await post(Object.assign({pass:T.pass},payload));
  if(!r.ok){ if(/mật khẩu/i.test(r.error||'')){ T.pass=''; sessionStorage.removeItem('cp_pass'); } throw new Error(r.error||'Lỗi'); }
  return r;
}

/* --- tải đề PDF (có đáp án): mở trang in, giáo viên chọn "Lưu dưới dạng PDF" --- */
async function downloadExamPdf(ids, label){
  const w = window.open('', '_blank');
  if(!w){ toast('Trình duyệt chặn cửa sổ mới — hãy cho phép pop-up rồi bấm lại.',6000); return; }
  w.document.write('<p style="font:16px sans-serif;padding:20px">Đang tạo file đề…</p>');
  try{
    const exams = [];
    for(const id of ids) exams.push((await adminCall({action:'adminGet',id})).exam);
    const PN = {mc:'Phần I. Trắc nghiệm nhiều lựa chọn', tf:'Phần II. Đúng/Sai', sa:'Phần III. Trả lời ngắn'};
    const base = new URL('.', location.href).href;
    const fmtText = s => esc(s).replace(/\n/g,'<br>');
    const nodes = str => { let out='', last=0, m; const re=/\[img:([^\]\s]+)\]/g;
      while((m=re.exec(str))){ const t=str.slice(last,m.index).trim(); if(t) out+='<div>'+fmtText(t)+'</div>';
        if(okImg(m[1])) out+='<img src="'+esc(m[1])+'">'; last=m.index+m[0].length; }
      const t=str.slice(last).trim(); if(t) out+='<div>'+fmtText(t)+'</div>'; return out; };
    const ansOf = (p,k) => p==='tf' ? (k||[]).map((c,i)=>'abcd'[i]+') '+(c==='D'||c==='Đ'?'Đúng':'Sai')).join('; ')
                         : p==='sa' ? (k||[]).join(' hoặc ') : (k||'');
    let html = '';
    exams.forEach((ex,ei)=>{
      html += '<section class="exam"><h1>'+esc(ex.title)+'</h1>';
      Object.keys(ex.codes||{}).forEach(code=>{
        html += '<h2>Mã đề '+esc(code)+'</h2>';
        ['mc','tf','sa'].forEach(p=>{
          const cfg = ex.parts[p], en = ex.codes[code][p]; if(!cfg||!cfg.enabled||!en) return;
          html += '<h3>'+PN[p]+'</h3>';
          for(let q=1;q<=cfg.n;q++){
            const sol = (en.sol||{})[q] || '', k = sol.indexOf('@@LG'); let stmt='', lg='';
            if(k>=0){ stmt=sol.slice(0,k).trim(); lg=sol.slice(k+4).trim(); }
            else { const imgs=[]; lg=String(sol).replace(/\[img:([^\]\s]+)\]/g,(m,u)=>{ imgs.push('[img:'+u+']'); return ''; }).trim(); stmt=imgs.join('\n'); }
            html += '<div class="q"><b>Câu '+q+'.</b> '+nodes(stmt)
              +'<div class="ans">Đáp án: <b>'+esc(ansOf(p,(en.key||[])[q-1]))+'</b></div>'
              +(lg? '<div class="lg"><i>Lời giải:</i> '+nodes(lg)+'</div>' : '')+'</div>';
          }
        });
      });
      html += '</section>';
    });
    const css = 'body{font:14px/1.5 "Times New Roman",serif;margin:0;padding:16px 24px;color:#000}'
      +'.bar{background:#fff7d6;border:1px solid #e6c200;padding:8px 12px;margin-bottom:12px;font:14px sans-serif}'
      +'h1{font-size:20px;text-align:center;margin:0 0 8px}h2{font-size:17px;border-bottom:1px solid #000;margin:14px 0 6px}h3{font-size:15px;margin:12px 0 4px}'
      +'.exam{page-break-after:always}.exam:last-child{page-break-after:auto}'
      +'.q{margin:8px 0;page-break-inside:avoid}img{max-width:100%;display:block;margin:4px 0}'
      +'.ans{color:#0a5;margin:2px 0}.lg{margin:2px 0 0 12px;color:#222}'
      +'@media print{.bar{display:none}body{padding:0}}';
    const bar = '<div class="bar">Trong hộp thoại in, chọn máy in <b>“Lưu dưới dạng PDF”</b> (Save as PDF) rồi bấm Lưu.</div>';
    const S_ = '<'+'script';
    const page = '<!doctype html><html><head><meta charset="utf-8"><title>'+esc(label)+'</title><base href="'+base+'">'
      +'<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css"><style>'+css+'</style>'
      +S_+' src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></'+'script>'
      +S_+' src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></'+'script></head><body>'
      +bar+html
      +S_+'>window.addEventListener("load",function(){try{renderMathInElement(document.body,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false},{left:"\\\\(",right:"\\\\)",display:false}],throwOnError:false});}catch(e){}setTimeout(function(){window.print();},400);});</'+'script></body></html>';
    w.document.open(); w.document.write(page); w.document.close();
  }catch(e){ w.close(); toast(e.message,6000); }
}

const GV_COLLAPSED = new Set();                         // nhóm đang thu gọn trong danh sách bài (chỉ nhớ trong phiên)
async function gvExams(body){
  body.replaceChildren(h('span',{class:'spin'}));
  let r; try{ r = await adminCall({action:'adminList'}); }catch(e){ body.replaceChildren(h('div',{class:'note bad'},e.message)); return; }
  T.exams = r.exams;
  const base = location.origin+location.pathname;
  /* gom bài theo "loại" = phần tên trước dấu —  (giống trang học sinh) */
  const groupOf = e => e.title.split(' — ')[0];
  const groups = [], gi = {};
  r.exams.forEach(e=>{ const n=groupOf(e); if(!(n in gi)){ gi[n]=groups.length; groups.push({name:n,list:[]}); } groups[gi[n]].list.push(e); });
  const examRow = e => h('div',{class:'card'}, h('div',{class:'part'},
      h('div',{}, h('h2',{style:'margin:0'},e.title), h('div',{class:'small'},'mã: '+e.id+' · ', h('span',{class:'badge '+(e.active?'ok':'')},e.active?'đang mở':'đã đóng'))),
      h('div',{class:'row'},
        h('button',{class:'ghost sm',onclick:()=>downloadExamPdf([e.id],e.title)},'Tải đề PDF'),
        h('button',{class:'ghost sm',onclick:()=>{ navigator.clipboard.writeText(base+'?exam='+e.id); toast('Đã chép link học sinh.'); }},'Chép link'),
        h('button',{class:'sm',onclick:()=>gvEdit(e.id)},'Sửa'),
        h('button',{class:e.active?'danger sm':'sm',onclick:async()=>{ try{ await adminCall({action:'adminActive',id:e.id,active:!e.active}); toast(e.active?'Đã đóng — học sinh không thấy bài này.':'Đã mở — học sinh có thể chụp phiếu và xem đáp án.'); gvExams(body); }catch(er){ toast(er.message,6000); } }},e.active?'Đóng link':'Mở link'),
        h('button',{class:'danger sm',onclick:async()=>{ if(!confirm('Xoá bài “'+e.title+'”? (Điểm đã lưu vẫn còn trong Sheet)')) return;
          try{ await adminCall({action:'adminDelete',id:e.id}); toast('Đã xoá.'); gvExams(body);}catch(er){toast(er.message);} }},'Xoá'))));
  /* mở / đóng cả nhóm: một lần gọi máy chủ (adminActiveMany); máy chủ cũ chưa có thì lặp từng bài */
  const setGroup = async (g, active)=>{
    const ids = g.list.filter(e=>!!e.active!==active).map(e=>e.id);
    if(!ids.length){ toast(active?'Cả nhóm đã mở sẵn.':'Cả nhóm đã đóng sẵn.'); return; }
    if(!confirm((active?'Mở':'Đóng')+' '+ids.length+' bài trong nhóm “'+g.name+'”?')) return;
    toast('Đang cập nhật '+ids.length+' bài…',60000);
    try{
      try{ await adminCall({action:'adminActiveMany',ids:ids,active:active}); }
      catch(er){ if(!/không hợp lệ/i.test(er.message)) throw er;
        for(const id of ids) await adminCall({action:'adminActive',id:id,active:active}); }
      toast((active?'Đã mở ':'Đã đóng ')+ids.length+' bài trong nhóm.');
    }catch(er){ toast(er.message,6000); }
    gvExams(body);
  };
  const groupBlock = g => {
    if(g.list.length<2) return g.list.map(examRow);
    const open = g.list.filter(e=>e.active).length, collapsed = GV_COLLAPSED.has(g.name);
    return [ h('div',{class:'card',style:'border-left:5px solid var(--acc)'}, h('div',{class:'part'},
        h('div',{}, h('h2',{style:'margin:0'},g.name), h('div',{class:'small'},g.list.length+' bài · ', h('span',{class:'badge '+(open===g.list.length?'ok':open?'warn':'')}, open===g.list.length?'đang mở cả nhóm':open?open+' bài đang mở':'đã đóng cả nhóm'))),
        h('div',{class:'row'},
          h('button',{class:'ghost sm',onclick:()=>downloadExamPdf(g.list.map(e=>e.id),g.name)},'Tải đề PDF cả nhóm'),
          h('button',{class:'sm',onclick:()=>setGroup(g,true)},'Mở cả nhóm'),
          h('button',{class:'danger sm',onclick:()=>setGroup(g,false)},'Đóng cả nhóm'),
          h('button',{class:'ghost sm',onclick:()=>{ navigator.clipboard.writeText(base+'?exam='+g.list[0].id); toast('Đã chép link nhóm (học sinh vào đúng loại bài này).'); }},'Chép link nhóm'),
          h('button',{class:'ghost sm',onclick:()=>{ if(collapsed) GV_COLLAPSED.delete(g.name); else GV_COLLAPSED.add(g.name); gvExams(body); }},collapsed?'Hiện danh sách':'Thu gọn')))),
      collapsed? null : h('div',{style:'margin-left:14px'}, g.list.map(examRow)) ];
  };
  body.replaceChildren(
    h('div',{class:'row',style:'margin-bottom:8px'}, h('button',{onclick:()=>gvEdit(null)},'+ Tạo bài mới'), h('button',{class:'ghost',onclick:()=>seedCaps(body)},'Khôi phục 7 cấp mẫu')),
    r.exams.length? groups.map(groupBlock) : h('div',{class:'card'},'Chưa có bài nào. Bấm “Tạo bài mới”.'));
}

              : F('Điểm mỗi câu',h('input',{type:'text',value:String(c.pt).replace('.',','),oninput:e=>{const v=parseFloat(e.target.value.replace(',','.'));if(isFinite(v))c.pt=v;}}))):null);
    };

      cur? h('button',{class:'danger sm',onclick:()=>{ if(confirm('Xoá mã đề '+cur+'?')){delete ex.codes[cur];cur=Object.keys(ex.codes)[0]||'';render();}}},'Xoá mã '+cur):null);
    const hints={

      tf:'Mỗi câu 4 ký tự Đ/S theo thứ tự a,b,c,d. Ví dụ: ĐSĐĐ SSĐS ĐĐĐS SĐSĐ',
      sa:'Mỗi câu một dòng. Có thể ghi “1: 2,5”. Nhiều đáp án chấp nhận: 2,5|2,50'};

        h('div',{class:'small'},'Mỗi lời giải bắt đầu bằng “Câu N:”. Gõ công thức trong $…$ (LaTeX) — học sinh sẽ thấy công thức đẹp.')); }) : h('div',{class:'note warn'},'Thêm ít nhất một mã đề.');
    root.replaceChildren(
      h('div',{class:'row'},h('button',{class:'ghost sm',onclick:()=>gvShell()},'← Danh sách'),h('h2',{style:'margin:0'},id?'Sửa bài':'Bài mới')),

      PARTS.map(partBox),
      h('div',{class:'card'}, h('h2',{},'Mã đề & đáp án'), window.DAN ? DAN.panel({ex, cur:()=>cur, setCur:c=>{cur=c;}, render}) : null, codeBar, codeEd),

  }
  async function save(){
    const errs=[]; const out=JSON.parse(JSON.stringify(ex));
    for(const p of PARTS) if(out.parts[p].enabled && !(out.parts[p].n>=1)) out.parts[p].enabled=false;   // phần không có câu = bỏ phần
    if(!out.title.trim()) errs.push('Chưa đặt tên bài.');
    if(!/^[a-z0-9-]{2,40}$/.test(out.id)) errs.push('Mã bài chưa hợp lệ.');
    const en=PARTS.filter(p=>out.parts[p].enabled); if(!en.length) errs.push('Bật ít nhất một phần.');
    const codes=Object.keys(out.codes); if(!codes.length) errs.push('Chưa có mã đề.');
    for(const c of codes){ for(const p of en){
      const e=out.codes[c][p]||{keyText:'',solText:''}; const n=out.parts[p].n;
      const r=({mc:parseKeyMC,tf:parseKeyTF,sa:parseKeySA})[p](e.keyText,n);

      out.codes[c][p]={keyText:e.keyText,solText:e.solText||'',key:r.key,sol:parseSolutions(e.solText)}; } }
    for(const c of codes) for(const p of PARTS) if(!out.parts[p].enabled) delete out.codes[c][p];
    if(errs.length){ toast(errs[0],6500); alert(errs.join('\n')); return; }
    try{ await adminCall({action:'adminSave',exam:out}); delete GVS.cache[out.id]; toast('Đã lưu.'); id=out.id; gvShell(); }
    catch(e){ toast(e.message,6000); }
  }
  render();
}

  async function load(){
    out.replaceChildren(h('span',{class:'spin'}));
    try{ data=await adminCall({action:'adminResults',id:sel.value}); }catch(e){ out.replaceChildren(h('div',{class:'note bad'},e.message)); return; }
    paint();
  }
  function paint(){
    const hd=data.header, rows=data.rows.slice();
    if(sortCol>=0) rows.sort((a,b)=>{ const x=a[sortCol],y=b[sortCol]; const c=(typeof x==='number'&&typeof y==='number')?x-y:String(x).localeCompare(String(y),'vi'); return asc?c:-c; });
    const sc=rows.map(r=>Number(r[14])).filter(isFinite);
    const stat = sc.length? `${sc.length} bài · TB ${fmt(sc.reduce((a,b)=>a+b,0)/sc.length)} · cao nhất ${fmt(Math.max(...sc))} · thấp nhất ${fmt(Math.min(...sc))}` : 'Chưa có bài nộp.';
    out.replaceChildren(
      h('div',{class:'row',style:'margin:10px 0'}, h('span',{class:'badge ok'},stat), h('span',{class:'grow'}),
        h('button',{class:'ghost sm',onclick:()=>csv(hd,rows)},'Tải CSV'),
        h('button',{class:'sm',onclick:()=>window.open(data.sheetUrl,'_blank')},'Mở Google Sheet')),
      h('div',{class:'tablewrap'}, h('table',{}, h('thead',{}, h('tr',{}, hd.map((c,i)=>h('th',{onclick:()=>{ asc=(sortCol===i)?!asc:true; sortCol=i; paint(); }},c)))),
        h('tbody',{}, rows.map(r=>h('tr',{}, r.map(v=>h('td',{},v===''?'':String(v)))))))));
  }
  function csv(hd,rows){
    const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
    const txt='﻿'+[hd,...rows].map(r=>r.map(q).join(',')).join('\r\n');
    const a=h('a',{href:URL.createObjectURL(new Blob([txt],{type:'text/csv'})),download:'ket-qua.csv'}); document.body.append(a); a.click(); a.remove();
  }
  load();
}

/* --- cài đặt --- */

  const apiIn = h('input',{type:'text',placeholder:'https://script.google.com/macros/s/…/exec',value:localStorage.getItem('cp_api')||''});
  body.replaceChildren(
    h('div',{class:'card'}, h('h2',{},'Kết nối máy chủ chấm bài'),

      h('ol',{style:'padding-left:20px;margin:0'},
        h('li',{html:'Tạo <b>Google Sheet mới</b> → menu <b>Tiện ích mở rộng → Apps Script</b>.'}),
        h('li',{html:'Xoá code mẫu, dán toàn bộ nội dung file <b>Code.gs</b>, <b>đổi ADMIN_PASS</b>, bấm lưu.'}),
        h('li',{html:'<b>Triển khai → Tùy chọn triển khai mới → Ứng dụng web</b>: Thực thi bằng <b>Tôi</b>, Quyền truy cập <b>Bất kỳ ai</b> → cấp quyền → chép link kết thúc bằng <code>/exec</code>.'}),
        h('li',{html:'Dán link vào file <b>config.js</b> (cùng thư mục với index.html), rồi kéo thả thư mục lên <b>Netlify</b>. Muốn thử nhanh: dán link vào ô dưới (chỉ lưu trên máy này).'}))),
    h('div',{class:'card'}, h('label',{},'Link /exec để thử trên máy này'), apiIn,
      h('div',{class:'row',style:'margin-top:10px'},
        h('button',{class:'sm',onclick:async()=>{ localStorage.setItem('cp_api',apiIn.value.trim()); try{ const d=await getExams(); toast(d.ok?`Kết nối được. Có ${d.exams.length} bài đang mở.`:'Máy chủ báo lỗi.',5000);}catch(e){toast('Không kết nối được: '+e.message,6000);} }},'Lưu & kiểm tra'),
        h('button',{class:'ghost sm',onclick:()=>{localStorage.removeItem('cp_api');apiIn.value='';toast('Đã xoá.');}},'Xoá'))));
}

/* --- GV chấm bằng ảnh: chụp/chọn nhiều ảnh, sửa tay chỗ tô, thấy điểm ngay — không nộp lên máy chủ --- */
const GVS = { cache:{}, queue:[], total:0 };
const GVS_KEY = 'cp_gv_rows';
function gvRowsAll(){ try{ return JSON.parse(localStorage.getItem(GVS_KEY)||'{}'); }catch(e){ return {}; } }
function gvRowsSave(all){ try{ localStorage.setItem(GVS_KEY, JSON.stringify(all)); }catch(e){ toast('Không lưu được bảng điểm trên máy này (bộ nhớ trình duyệt bị chặn).'); } }
function gvSheetOptions(ex){
  const ps = PARTS.filter(p=>ex.parts[p]&&ex.parts[p].enabled), fits = cap => ps.every(p=>ex.parts[p].n<=cap[p]);
  const out = [];
  if(fits({mc:40,tf:8,sa:8})) out.push(['sch','Phiếu giấy lớp 10 & 11 — tự nhận trang 1 / trang 2']);
  Object.keys(FULL_SHEETS).filter(t=>!FULL_SHEETS[t].hidden && fits(FULL_SHEETS[t].cap)).forEach(t=>out.push(['full:'+t, FULL_SHEETS[t].name]));
  ps.filter(p=>ex.parts[p].n<=A5_CAP[p]).forEach(p=>out.push(['a5:'+p, 'Phiếu A5 — '+PART_NAME[p]]));
  return out;
}
async function gvScan(body){
  body.replaceChildren(h('span',{class:'spin'}));
  let list; try{ list = (await adminCall({action:'adminList'})).exams; }catch(e){ body.replaceChildren(h('div',{class:'note bad'},e.message)); return; }
  if(!list.length){ body.replaceChildren(h('div',{class:'card'},'Chưa có bài nào.')); return; }
  let exId = localStorage.getItem('cp_gv_exam'); if(!list.some(e=>e.id===exId)) exId = list[0].id;
  const selEx = h('select',{}, list.map(e=>h('option',{value:e.id,selected:e.id===exId}, e.title+(e.active?'':' (đã đóng)'))));
  const selSheet = h('select',{});
  const area = h('div',{});
  const tableBox = h('div',{});
  let ex = null;
  async function loadExam(){
    exId = selEx.value; try{ localStorage.setItem('cp_gv_exam',exId); }catch(e){}
    area.replaceChildren(h('span',{class:'spin'}),' Đang tải đáp án…');
    try{ ex = GVS.cache[exId] || (GVS.cache[exId] = (await adminCall({action:'adminGet',id:exId})).exam); }
    catch(e){ area.replaceChildren(h('div',{class:'note bad'},e.message)); return; }
    if(!ex){ area.replaceChildren(h('div',{class:'note bad'},'Không tìm thấy bài.')); return; }
    const opts = gvSheetOptions(ex);
    const want = localStorage.getItem('cp_gv_sheet_'+exId);
    selSheet.replaceChildren(...opts.map(([v,l])=>h('option',{value:v,selected:v===want},l)));
    if(!opts.length){ area.replaceChildren(h('div',{class:'note bad'},'Không có mẫu phiếu nào đủ chỗ cho số câu của bài này.')); return; }
    const ps = PARTS.filter(p=>ex.parts[p]&&ex.parts[p].enabled);
    area.replaceChildren(
      h('div',{class:'small',style:'margin-top:6px'}, ps.map(p=>PART_SHORT[p]+' '+ex.parts[p].n+' câu').join(' · ')+' · mã đề: '+(Object.keys(ex.codes||{}).join(', ')||'chưa có')),
      h('label',{},'Mẫu phiếu'), selSheet,
      h('div',{class:'row',style:'margin-top:12px'},
        h('button',{onclick:()=>cam.click()},'Chụp phiếu'),
        h('button',{class:'ghost',onclick:()=>gal.click()},'Chọn ảnh / PDF (được chọn nhiều)'), cam, gal),
      h('div',{class:'small',style:'margin-top:8px'},'Mỗi ảnh mở ra bảng chấm: xanh = tô đúng, đỏ = tô sai, vòng nét đứt = đáp án đúng. Chạm vào ô để thêm/bỏ chỗ tô, điểm tính lại ngay. Không gửi gì lên máy chủ — bảng điểm chỉ lưu trên máy này.'));
    paintTable();
  }
  const rowsOf = () => (gvRowsAll()[exId] || []);
  function setRows(rows){ const all=gvRowsAll(); all[exId]=rows; gvRowsSave(all); }
  function totals(r){
    const ps = PARTS.filter(p=>ex.parts[p]&&ex.parts[p].enabled);
    let t=0, m=0; ps.forEach(p=>{ m += r.parts[p] ? r.parts[p].max : 0; t += r.parts[p] ? r.parts[p].pts : 0; });
    const missing = ps.filter(p=>!r.parts[p]);
    return {t:Math.round(t*100)/100, m:Math.round(m*100)/100, missing};
  }
  function paintTable(){
    if(!ex){ tableBox.replaceChildren(); return; }
    const rows = rowsOf(), ps = PARTS.filter(p=>ex.parts[p]&&ex.parts[p].enabled);
    const max = ps.reduce((a,p)=>{ const c=ex.parts[p]; return a + (p==='tf' ? c.n*((c.scale&&c.scale[4])||1) : c.n*(Number(c.pt)||0)); },0);
    const head = ['#','Học sinh','Mã đề',...ps.map(p=>PART_SHORT[p]),'Tổng', ex.normalize!==false?'Thang 10':null,''].filter(x=>x!==null);
    const body = rows.map((r,i)=>{ const T=totals(r);
      return h('tr',{}, h('td',{},String(i+1)), h('td',{},r.label||''), h('td',{},r.code||''),
        ps.map(p=>h('td',{}, r.parts[p] ? fmt(r.parts[p].pts) : h('span',{class:'badge warn'},'thiếu'))),
        h('td',{}, h('b',{},fmt(T.t)), '/'+fmt(max)),
        ex.normalize!==false ? h('td',{}, max? fmt(Math.round(T.t/max*1000)/100) : '') : null,
        h('td',{}, h('button',{class:'ghost sm',onclick:()=>{ const nm=prompt('Tên / SBD học sinh:', r.label||''); if(nm===null) return; const rs=rowsOf(); rs[i].label=nm.trim(); setRows(rs); paintTable(); }},'Đổi tên'), ' ',
          h('button',{class:'danger sm',onclick:()=>{ if(!confirm('Xoá dòng '+(i+1)+'?')) return; const rs=rowsOf(); rs.splice(i,1); setRows(rs); paintTable(); }},'Xoá')));
    });
    const sc = rows.map(r=>totals(r).t);
    tableBox.replaceChildren(h('div',{class:'card'},
      h('div',{class:'row'}, h('h2',{style:'margin:0'},'Bảng điểm trên máy này ('+rows.length+' bài)'), h('span',{class:'grow'}),
        rows.length? h('button',{class:'ghost sm',onclick:()=>csvRows(rows,ps,max)},'Tải CSV') : null,
        rows.length? h('button',{class:'danger sm',onclick:()=>{ if(confirm('Xoá toàn bộ '+rows.length+' dòng của bài này?')){ setRows([]); paintTable(); } }},'Xoá hết') : null),
      rows.length ? h('div',{class:'small',style:'margin:6px 0'}, `TB ${fmt(sc.reduce((a,b)=>a+b,0)/sc.length)} · cao nhất ${fmt(Math.max(...sc))} · thấp nhất ${fmt(Math.min(...sc))} (trên ${fmt(max)} điểm)`) : h('div',{class:'small'},'Chưa chấm bài nào.'),
      rows.length ? h('div',{class:'tablewrap'}, h('table',{}, h('thead',{},h('tr',{},head.map(c=>h('th',{},c)))), h('tbody',{},body))) : null));
  }
  function csvRows(rows,ps,max){
    const q=v=>'"'+String(v).replace(/"/g,'""')+'"', n=v=>String(v).replace('.',',');
    const hd=['STT','Học sinh','Mã đề',...ps.map(p=>'Điểm '+PART_SHORT[p]),'Tổng','Tối đa','Thang 10','Ô sửa tay','Thời gian',...ps.map(p=>'Bài làm '+PART_SHORT[p])];
    const lines=rows.map((r,i)=>{ const T=totals(r); return [i+1,r.label||'',r.code||'',...ps.map(p=>r.parts[p]?n(r.parts[p].pts):''),n(T.t),n(max),max?n(Math.round(T.t/max*1000)/100):'',r.edits||0,r.time||'',...ps.map(p=>r.parts[p]?r.parts[p].ans:'')]; });
    const txt='﻿'+[hd,...lines].map(r=>r.map(q).join(',')).join('\r\n');
    const a=h('a',{href:URL.createObjectURL(new Blob([txt],{type:'text/csv'})),download:'cham-'+exId+'.csv'}); document.body.append(a); a.click(); a.remove();
  }
  function onSave(rec){
    const rows = rowsOf(), now = new Date().toLocaleString('vi-VN');
    if(rec.target>=0 && rows[rec.target]){ const r=rows[rec.target]; Object.assign(r.parts, rec.parts); if(rec.label) r.label=rec.label; r.code=r.code||rec.code; r.edits=(r.edits||0)+rec.edits; r.time=now; }
    else rows.push({label:rec.label, code:rec.code, parts:rec.parts, edits:rec.edits, time:now});
    setRows(rows); paintTable();
    const T = totals(rec.target>=0&&rows[rec.target]?rows[rec.target]:rows[rows.length-1]);
    toast('Đã ghi: '+fmt(T.t)+' điểm'+(T.missing.length?' (còn thiếu '+T.missing.map(p=>PART_SHORT[p]).join(', ')+')':''),4000);
    GVS.lastCode = rec.code;
  }
  function next(){
    const f = GVS.queue.shift(); if(!f){ GVS.total=0; return; }
    const v = selSheet.value, rows = rowsOf();
    const o = {gv:true, exam:ex, rows, onSave, onDone:next, queueLeft:GVS.queue.length, lastCode:GVS.lastCode||''};
    if(v==='sch') pick('sch', f, o);
    else if(v.startsWith('full:')) pick('full', f, Object.assign(o,{sheet:v.slice(5)}));
    else pick(v.slice(3), f, o);
  }
  async function go(files){
    if(!ex || !files || !files.length) return;
    try{ localStorage.setItem('cp_gv_sheet_'+exId, selSheet.value); }catch(e){}
    try{ files = await DAN.expandFiles(Array.from(files)); }catch(e){ toast(e.message||'Không mở được tệp PDF.',6000); return; }   // PDF nhiều trang: mỗi trang một phiếu
    GVS.queue = Array.from(files); GVS.total = GVS.queue.length; next();
  }
  const cam = h('input',{type:'file',accept:'image/*',capture:'environment',hidden:true,onchange:e=>{ go(e.target.files); e.target.value=''; }});
  const gal = h('input',{type:'file',accept:'image/*,application/pdf,.pdf',multiple:true,hidden:true,onchange:e=>{ go(Array.from(e.target.files)); e.target.value=''; }});
  selEx.addEventListener('change',loadExam);
  body.replaceChildren(
    h('div',{class:'card'}, h('h2',{},'Chấm bằng ảnh (giáo viên)'),
      h('p',{class:'small',style:'margin:0'},'Quét phiếu của học sinh, thấy ngay điểm từng phần và câu sai (màu đỏ). Dùng để chấm nhanh / kiểm tra — không nộp lên máy chủ.'),
      h('label',{},'Bài kiểm tra'), selEx, area),
    tableBox);
  loadExam();
}

/* --- thử đọc ảnh --- */
function gvTest(body){
  let type='full';
  const sel=h('select',{onchange:e=>type=e.target.value}, Object.keys(FULL_SHEETS).map(t=>h('option',{value:t},FULL_SHEETS[t].name)).concat(PARTS.map(p=>h('option',{value:p},PART_NAME[p]))));
  const go=f=>{ if(FULL_SHEETS[type]) pick(/^sch/.test(type)?type:'full',f,{test:true,sheet:type}); else pick(type,f,{test:true}); };
  const cam=h('input',{type:'file',accept:'image/*',capture:'environment',hidden:true,onchange:e=>{ go(e.target.files[0]); e.target.value=''; }});
  const gal=h('input',{type:'file',accept:'image/*',hidden:true,onchange:e=>{ go(e.target.files[0]); e.target.value=''; }});
  body.replaceChildren(h('div',{class:'card'}, h('h2',{},'Thử đọc ảnh (không chấm, không lưu)'),
    h('p',{class:'small'},'Dùng để kiểm tra ánh sáng, góc chụp, độ đậm bút trước khi cho cả lớp làm.'),
    h('label',{},'Loại phiếu'), sel,
    h('div',{class:'row',style:'margin-top:12px'}, h('button',{onclick:()=>cam.click()},'Chụp ảnh'), h('button',{class:'ghost',onclick:()=>gal.click()},'Chọn ảnh'), cam, gal)));
}

/* ---------- định tuyến ---------- */
function route(){
  closeModal();
  if(location.hash==='#gv'){ viewGV(); }
  else { $('#lnkRole').textContent='Dành cho giáo viên'; $('#lnkRole').href='#gv'; viewInfo(); }
}
window.addEventListener('hashchange',route);
route();
