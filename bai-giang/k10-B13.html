<script>/* Khung mô phỏng cho bài giảng khối 11 (trình chiếu ảnh).
   Mỗi bài có file mo_phong/<MA>.js gọi MP.dangKy(ma, chỉ_số_slide_từ_0, {ten, goiY, tao(ui) -> {ve(ctx,W,H,t,dt), datLai?, nhap?}}).
   Trang trình chiếu hiện nút "Mô phỏng" (phím M) ở slide có mô phỏng. */
window.MP = (function () {
  var DS = {}, K, cv, ctx, dk, chay = null, mo = false, tam = false, toc = 1, t = 0, last = 0, nutVe = null, W = 0, H = 0;
  function dangKy(ma, i, def) { DS[ma + "@" + i] = def }
  function co(ma, i) { return !!DS[ma + "@" + i] }
  function dungKhung() {
    if (K) return;
    var st = document.createElement("style");
    st.textContent =
      "#mpK{position:fixed;inset:0;z-index:9998;background:rgba(3,7,18,.82);display:none;padding:1.5vh 1.5vw}" +
      "#mpK.mo{display:flex}" +
      "#mpK .mp-hop{margin:auto;width:100%;height:100%;display:flex;flex-direction:column;background:#0f172a;border:1px solid #2a3a5c;border-radius:12px;overflow:hidden;box-shadow:0 10px 40px #000a}" +
      "#mpK .mp-dau{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 16px;border-bottom:1px solid #24304a}" +
      "#mpK .mp-ten{font-size:17px;color:#f1f5f9}#mpK .mp-gc{flex:1;min-width:0;color:#9fb0cc;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}" +
      "#mpK .mp-than{flex:1;min-height:0;position:relative}#mpK canvas{position:absolute;inset:0;width:100%;height:100%;display:block}" +
      "#mpK .mp-dk{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:10px 16px;border-top:1px solid #24304a;font-size:14px;color:#d6deeb}" +
      "#mpK button,#mpK select{font:600 14px 'Segoe UI',sans-serif;color:#e5e7eb;background:#1c2742;border:1px solid #33415f;border-radius:999px;padding:6px 13px;cursor:pointer;min-height:34px}" +
      "#mpK button:hover{border-color:#60a5fa}#mpK :focus-visible{outline:3px solid #60a5fa;outline-offset:2px}" +
      "#mpK label{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}#mpK input[type=range]{width:130px;accent-color:#38bdf8}" +
      "#mpK input[type=checkbox]{width:17px;height:17px;accent-color:#38bdf8}#mpK output{font-weight:700;color:#7dd3fc;font-variant-numeric:tabular-nums;min-width:3.2em;display:inline-block}" +
      "@media (max-width:720px){#mpK .mp-gc{display:none}#mpK input[type=range]{width:100px}}";
    document.head.appendChild(st);
    K = document.createElement("div"); K.id = "mpK"; K.setAttribute("role", "dialog"); K.setAttribute("aria-modal", "true");
    K.innerHTML = '<div class="mp-hop"><div class="mp-dau"><b class="mp-ten"></b><span class="mp-gc"></span><button type="button" class="mp-dong" title="Đóng (Esc)">Đóng ✕</button></div>' +
      '<div class="mp-than"><canvas></canvas></div><div class="mp-dk"></div></div>';
    document.body.appendChild(K);
    cv = K.querySelector("canvas"); ctx = cv.getContext("2d"); dk = K.querySelector(".mp-dk");
    K.querySelector(".mp-dong").onclick = dong;
    cv.addEventListener("click", function (e) {
      if (!chay || !chay.nhap) return; var r = cv.getBoundingClientRect(); chay.nhap(e.clientX - r.left, e.clientY - r.top, r.width, r.height);
    });
    document.addEventListener("keydown", function (e) {
      if (!mo) return;
      var tg = e.target.tagName;
      if (e.key === "Escape") { dong(); e.preventDefault(); e.stopImmediatePropagation() }
      else if (e.key === " " && tg !== "BUTTON" && tg !== "INPUT" && tg !== "SELECT") { datTam(!tam); e.preventDefault(); e.stopImmediatePropagation() }
    });
  }
  var nutTam;
  function datTam(x) { tam = x; nutTam.textContent = tam ? "▶ Chạy tiếp" : "⏸ Tạm dừng" }
  function datLai() { t = 0; if (chay && chay.datLai) chay.datLai() }
  function taoUI() {
    dk.innerHTML = "";
    nutTam = them("button", "⏸ Tạm dừng"); nutTam.type = "button"; nutTam.title = "Tạm dừng / chạy tiếp (phím cách)"; nutTam.onclick = function () { datTam(!tam) };
    var nl = them("button", "↺ Bắt đầu lại"); nl.type = "button"; nl.onclick = datLai;
    var lb = them("label", "Tốc độ phát "), s = document.createElement("select");
    [[0.25, "×0,25 (rất chậm)"], [0.5, "×0,5 (chậm)"], [1, "×1 (thật)"]].forEach(function (o) { var op = document.createElement("option"); op.value = o[0]; op.textContent = o[1]; s.appendChild(op) });
    s.value = String(toc); s.onchange = function () { toc = +s.value }; lb.appendChild(s);
    return {
      truot: function (nhan, a, b, buoc, gt, dv, fn) {
        var l = them("label", nhan + " "), r = document.createElement("input"), o = document.createElement("output");
        r.type = "range"; r.min = a; r.max = b; r.step = buoc; r.value = gt; r.setAttribute("aria-label", nhan);
        var hien = function () { o.textContent = String(+r.value).replace(".", ",") + (dv ? " " + dv : "") };
        r.oninput = function () { hien(); fn(+r.value) }; hien(); l.appendChild(r); l.appendChild(o); return r;
      },
      chon: function (nhan, gt, fn) {
        var l = them("label", ""), c = document.createElement("input"); c.type = "checkbox"; c.checked = gt;
        c.onchange = function () { fn(c.checked) }; l.appendChild(c); l.appendChild(document.createTextNode(nhan)); return c;
      },
      nut: function (nhan, fn) { var b = them("button", nhan); b.type = "button"; b.onclick = fn; return b },
      datLai: datLai,
      tocDo: function (x) { toc = x; s.value = String(x) }
    };
  }
  function them(tag, txt) { var e = document.createElement(tag); if (txt) e.textContent = txt; dk.appendChild(e); return e }
  function khung(ts) {
    if (!mo) return;
    var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0; last = ts;
    var d = tam ? 0 : dt * toc; t += d;
    var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    W = r.width; H = r.height;
    var cw = Math.round(W * dpr), ch = Math.round(H * dpr);
    if (cv.width !== cw || cv.height !== ch) { cv.width = cw; cv.height = ch }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (W > 20 && H > 20) chay.ve(ctx, W, H, t, d);
    requestAnimationFrame(khung);
  }
  function moMP(ma, i, t0) {
    var def = DS[ma + "@" + i]; if (!def) return;
    dungKhung(); nutVe = document.activeElement;
    K.querySelector(".mp-ten").textContent = def.ten; K.querySelector(".mp-gc").textContent = def.goiY || "";
    K.setAttribute("aria-label", "Mô phỏng: " + def.ten);
    toc = def.toc || 1; var ui = taoUI(); tam = false; t = 0; last = 0;
    chay = def.tao(ui); t = t0 || 0; mo = true; K.classList.add("mo");
    K.querySelector(".mp-dong").focus(); requestAnimationFrame(khung);
  }
  function dong() {
    if (!mo) return; mo = false; K.classList.remove("mo"); chay = null;
    if (nutVe && nutVe.focus) try { nutVe.focus() } catch (e) {}
  }
  return { dangKy: dangKy, co: co, mo: moMP, dong: dong, dangMo: function () { return mo } };
})();

/* Hàm vẽ dùng chung */
window.MPve = {
  hop: function (ctx, x, y, dong, o) {      // khung chữ nhiều dòng, góc trên trái tại (x, y)
    o = o || {}; ctx.save(); ctx.font = (o.co || 15) + "px 'Segoe UI',Roboto,Arial,sans-serif";
    var lh = (o.co || 15) * 1.45, w = 0; dong.forEach(function (d) { w = Math.max(w, ctx.measureText(d.replace(/\*/g, "")).width) });
    var h = lh * dong.length + 14; if (o.phai) x -= w + 20;
    ctx.fillStyle = o.nen || "rgba(15,23,42,.82)"; ctx.strokeStyle = "rgba(148,163,184,.35)"; ctx.lineWidth = 1;
    ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w + 20, h, 8); else ctx.rect(x, y, w + 20, h); ctx.fill(); ctx.stroke();
    ctx.textBaseline = "middle";
    dong.forEach(function (d, i) {   // *chữ* : tô màu nhấn
      var cx = x + 10, cy = y + 7 + lh * (i + .5), ph = d.split("*");
      ph.forEach(function (p, j) { ctx.fillStyle = j % 2 ? (o.nhan || "#fde047") : (o.chu || "#e2e8f0"); ctx.fillText(p, cx, cy); cx += ctx.measureText(p).width });
    });
    ctx.restore(); return h;
  },
  muiTen: function (ctx, x1, y1, x2, y2, mau, w) {
    var a = Math.atan2(y2 - y1, x2 - x1), L = Math.hypot(x2 - x1, y2 - y1), m = Math.min(14, L * .5) + (w || 3);
    ctx.save(); ctx.strokeStyle = ctx.fillStyle = mau; ctx.lineWidth = w || 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - Math.cos(a) * m * .6, y2 - Math.sin(a) * m * .6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - m * Math.cos(a - .45), y2 - m * Math.sin(a - .45)); ctx.lineTo(x2 - m * Math.cos(a + .45), y2 - m * Math.sin(a + .45)); ctx.closePath(); ctx.fill();
    ctx.restore();
  },
  kichThuoc: function (ctx, x1, x2, y, nhan, mau, nenSang) {   // mũi tên hai đầu nằm ngang có nhãn
    ctx.save(); ctx.strokeStyle = ctx.fillStyle = mau; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.moveTo(x1, y - 7); ctx.lineTo(x1, y + 7); ctx.moveTo(x2, y - 7); ctx.lineTo(x2, y + 7); ctx.stroke();
    [[x1, 1], [x2, -1]].forEach(function (p) { ctx.beginPath(); ctx.moveTo(p[0], y); ctx.lineTo(p[0] + 9 * p[1], y - 5); ctx.lineTo(p[0] + 9 * p[1], y + 5); ctx.closePath(); ctx.fill() });
    ctx.font = "bold 15px 'Segoe UI',sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
    if (!nenSang) { ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,.55)"; ctx.strokeText(nhan, (x1 + x2) / 2, y - 6) } ctx.fillText(nhan, (x1 + x2) / 2, y - 6);
    ctx.restore();
  },
  so: function (x, n) { return (+x).toFixed(n == null ? 1 : n).replace(".", ",") }
};
</script>
<script>/* Mô phỏng Bài 13 (khối 10). Tổng hợp và phân tích lực. Cân bằng lực.
   Gắn vào slide của bản pptx "Bài 13- Tong_hop_va_Phan_tich_Luc_da_sua.pptx" (chỉ số slide đếm từ 0):
     2, 3  Thí nghiệm ba lực kế, thu thập số liệu     4, 5, 6  Quy tắc hình bình hành, độ lớn hợp lực, trường hợp đặc biệt
     8, 10 Mặt phẳng nghiêng                          9        Phân tích lực
     11    Điều kiện cân bằng (ba lực)                12, 16   Vật treo hai dây, bài toán dây phơi
     15    Đồ thị độ lớn hợp lực theo góc (tìm F1, F2)                                                       */
(function () {
  var V = window.MPve, so = V.so, R = Math.PI / 180, TAU = Math.PI * 2;
  var XANH = "#60a5fa", DO = "#f87171", VANG = "#fde047", LUC = "#34d399", TIM = "#c4b5fd", XAM = "#94a3b8", CAM = "#fb923c";
  var FONT = "'Segoe UI',Roboto,Arial,sans-serif";

  function nen(ctx, W, H) {
    ctx.fillStyle = "#0b1530"; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(148,163,184,.08)"; ctx.lineWidth = 1; ctx.beginPath();
    for (var x = 0; x < W; x += 30) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H) }
    for (var y = 0; y < H; y += 30) { ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5) }
    ctx.stroke();
  }

(function(){

  function tiep(){if(!ttBuoc())go(cur+1)}
  function ttBuoc(){          /* trang tương tác cũ hiện từng bước (.step): bấm tiếp thì hiện bước kế trước khi sang slide sau */

  function moBT(){if(!btK.querySelector("iframe")){var f=document.createElement("iframe");f.title="Bài tập cuối bài";f.src="k11-bai-tap.html#"+MA;btK.appendChild(f)}btK.style.display="block";btK.querySelector("button").focus()}
  function dongBT(){btK.style.display="none";$("bBT").focus()}
  luoi.addEventListener("click",function(e){var b=e.target.closest("button");if(b)go(+b.dataset.i)});
  $("bTruoc").onclick=$("vTruoc").onclick=function(){go(cur-1)};
  $("bSau").onclick=$("vSau").onclick=tiep;
  $("bLuoi").onclick=moLuoi;$("bToan").onclick=toan;$("bBT").onclick=moBT;$("bMP").onclick=function(){if(window.MP)MP.mo(MA,slides[cur].mp)};btK.querySelector("button").onclick=dongBT;
  document.addEventListener("keydown",function(e){
    if(btK.style.display==="block"){if(e.key==="Escape")dongBT();return}
    var t=e.target.tagName;if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT"||e.ctrlKey||e.altKey||e.metaKey)return;
    if(document.querySelector(".hl-ov")||(window.MP&&MP.dangMo()))return;

    else if(k==="ArrowLeft"||k==="PageUp"){go(cur-1);e.preventDefault()}
    else if(k==="Home")go(0);else if(k==="End")go(slides.length-1);
    else if(k==="f"||k==="F")toan();else if(k==="o"||k==="O")moLuoi();else if(k==="b"||k==="B")moBT();
    else if((k==="m"||k==="M")&&window.MP&&MP.co(MA,slides[cur].mp))MP.mo(MA,slides[cur].mp);
    else if(k==="Escape")dongLuoi();
  });
  var x0=null;
  $("san").addEventListener("touchstart",function(e){x0=e.touches[0].clientX},{passive:true});
  $("san").addEventListener("touchend",function(e){if(x0===null)return;var d=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(d)>50)go(cur+(d<0?1:-1))},{passive:true});
  var m=/^#B[0-9]+@([0-9]+)$/.exec(window.__hsdhHash||"");go(m?+m[1]:0);

})();

<script>(function(){
  var MA="B13",KHOA="10-3.B13";
  try{var fe=window.frameElement;if(fe&&fe.id==='llFrame')return}catch(e){}
  var KB='hsdh_bg',KH='hsdh_v2';
  function doc(k){try{return JSON.parse(localStorage.getItem(k)||'null')||{}}catch(e){return{}}}
  function bg(){var o=doc(KB);o.pv=o.pv||[];o.notes=o.notes||[];o.lopMoi=o.lopMoi||{};o.goi=o.goi||{};return o}
  function ghi(o){try{localStorage.setItem(KB,JSON.stringify(o));return true}catch(e){return false}}
  function sua(f){var o=bg();f(o);return ghi(o)}
  function lops(){var h=doc(KH).lop||{},m=bg().lopMoi,o={},k;for(k in h)o[k]=h[k];for(k in m)o[k]=m[k];return o}
  function homNay(){return new Date().toLocaleDateString('vi-VN')}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function slideSo(){try{return cur+1}catch(e){return ''}}
  function $i(id){return document.getElementById(id)}
  /* âm thanh ngắn (Web Audio) */
  var AC=null;
  function tieng(f,d,v,kieu){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type=kieu||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.15,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
  function tach(){tieng(1200,.05,.08,'square')}
  function vui(){tieng(660,.15);setTimeout(function(){tieng(880,.15)},120);setTimeout(function(){tieng(1175,.25)},240)}
  function chuong(){[0,450,900].forEach(function(t){setTimeout(function(){tieng(880,.4,.25);tieng(1320,.4,.12)},t)})}

  var LOP=bg().lastLop||doc(KH).lastLop||'';
  /* nút mở bảng công cụ */
  var nut=document.createElement('button');nut.id='hl-nut';nut.type='button';nut.title='Công cụ lớp: Gọi tên (phím G), Bấm giờ, Chia nhóm, Ghi chú';nut.textContent='👥 Lớp';
  document.body.appendChild(nut);
  var pan=document.createElement('div');pan.id='hl-pan';pan.hidden=true;pan.setAttribute('role','dialog');pan.setAttribute('aria-label','Công cụ lớp');
  document.body.appendChild(pan);
  /* gõ chữ trong bảng công cụ không làm chuyển slide */
  /* phím: Esc đóng khung đang mở (gọi tên, chia nhóm) rồi mới đến bảng; G gọi tên;
     gõ chữ trong bảng hoặc khi đang có khung thì không làm chuyển slide */
  ['keyup','keypress'].forEach(function(t){document.addEventListener(t,function(e){if(document.querySelector('.hl-ov')||(e.target&&e.target.closest&&e.target.closest('#hl-pan')))e.stopPropagation()},true)});
  document.addEventListener('keydown',function(e){
    var mr=document.getElementById('hsdhMRk');if(mr&&mr.style.display==='block')return;
    var trong=e.target&&e.target.closest&&e.target.closest('#hl-pan');
    if(document.querySelector('.hl-ov')){if(e.key==='Escape')dongOv();e.stopPropagation();return}
    if(e.key==='Escape'&&!pan.hidden){moPan(false);e.stopPropagation();return}
    if(trong){e.stopPropagation();return}
    var tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT'||e.ctrlKey||e.altKey||e.metaKey)return;
    if(e.key==='g'||e.key==='G'){e.preventDefault();e.stopPropagation();goiTen()}
  },true);
  nut.onclick=function(){tach();moPan(pan.hidden)};
  function moPan(m){pan.hidden=!m;nut.classList.toggle('on',m);if(m)ve()}

  function ve(){
    var L=lops(),ten=Object.keys(L).sort(),ds=L[LOP]||[],b=bg(),g=b.goi[LOP],daGoi=(g&&g.ngay===homNay()&&g.ma===MA)?g.ds:[];
    var pvH=b.pv.filter(function(r){return r.lop===LOP&&r.ngay===homNay()&&r.bai===MA});
    var h='<button class="x" data-l="dong" aria-label="Đóng">✕</button><h4>Lớp</h4><div class="r"><select id="hl-lop" aria-label="Chọn lớp"><option value="">(chưa chọn)</option>'+ten.map(function(l){return'<option'+(l===LOP?' selected':'')+'>'+esc(l)+'</option>'}).join('')+'</select><button data-l="nhap">'+(ten.length?'Thêm / sửa lớp':'Nhập danh sách lớp')+'</button></div>';
    if(LOP)h+='<div class="m">'+ds.length+' học sinh · hôm nay đã gọi '+daGoi.length+' em</div>';
    h+='<div id="hl-nhap" hidden><input id="hl-tl" placeholder="Tên lớp, ví dụ 10A1" value="'+esc(LOP)+'" style="width:100%;margin:6px 0"><textarea id="hl-ds" rows="6" placeholder="Mỗi dòng một học sinh">'+esc(ds.join('\n'))+'</textarea><div class="r"><button class="c" data-l="luuLop">Lưu lớp</button><span class="m">Chỉ nhập tên, không nhập thông tin khác.</span></div></div>';
    h+='<h4>Gọi tên</h4><div class="r"><button class="c" data-l="goi"'+(ds.length?'':' disabled')+'>🎲 Gọi tên ngẫu nhiên (G)</button></div>';
    h+='<div class="r"><select id="hl-xp" aria-label="Học sinh xung phong"'+(ds.length?'':' disabled')+'><option value="">Em xung phong…</option>'+ds.map(function(n){return'<option>'+esc(n)+'</option>'}).join('')+'</select><button data-l="xp"'+(ds.length?'':' disabled')+'>Chấm</button></div>';
    if(pvH.length)h+='<div class="m">Phát biểu hôm nay ('+pvH.length+'):</div><ul>'+pvH.slice(-6).map(function(r){return'<li>'+esc(r.hs)+': '+(r.diem===1?'+1':r.diem===.5?'+0,5':'0')+' (slide '+r.slide+')</li>'}).join('')+'</ul><div class="r"><button data-l="hoan">Hoàn tác lần chấm cuối</button></div>';
    if(daGoi.length)h+='<div class="r"><button data-l="lamMoi">Cho gọi lại từ đầu</button></div>';
    h+='<h4>Bấm giờ</h4><div class="r">'+[[30,'30 giây'],[60,'1 phút'],[120,'2 phút'],[180,'3 phút'],[300,'5 phút'],[600,'10 phút']].map(function(x){return'<button data-l="gio" data-s="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div><div class="r"><button data-l="dung"'+(GIO.con>0||GIO.tm?'':' disabled')+'>'+(GIO.tm?'Tạm dừng':'Chạy tiếp')+'</button><button data-l="tat"'+(GIO.hien?'':' disabled')+'>Tắt đồng hồ</button></div>';
    h+='<h4>Chia nhóm</h4><div class="r"><label>Số nhóm <select id="hl-sn">'+[2,3,4,5,6,7,8].map(function(n){return'<option'+(n===4?' selected':'')+'>'+n+'</option>'}).join('')+'</select></label><button data-l="nhom"'+(ds.length?'':' disabled')+'>Chia nhóm ngẫu nhiên</button></div>';
    h+='<h4>Ghi chú nhanh</h4><textarea id="hl-gc" rows="2" placeholder="Lớp vướng chỗ nào, tiết sau cần làm gì (lưu kèm lớp và slide)"></textarea><div class="r"><button data-l="luuGc">Lưu ghi chú</button><span class="m" id="hl-msg" role="status"></span></div>';
    h+='<p class="m" style="margin:10px 0 0">Điểm phát biểu và ghi chú tự chuyển vào hồ sơ (mục Lớp học, Ghi chú sau tiết) khi mở hồ sơ trên cùng máy, cùng trình duyệt.</p>';
    pan.innerHTML=h;
  }
  function bao(m){var e=$i('hl-msg');if(e){e.textContent=m;setTimeout(function(){if(e)e.textContent=''},3000)}}
  pan.addEventListener('change',function(e){
    if(e.target.id==='hl-lop'){LOP=e.target.value;sua(function(o){o.lastLop=LOP});tach();ve()}
  });
  pan.addEventListener('click',function(e){
    var t=e.target.closest('button');if(!t||t.disabled)return;var l=t.getAttribute('data-l');if(!l)return;tach();
    if(l==='dong')return moPan(false);
    if(l==='nhap'){var n=$i('hl-nhap');n.hidden=!n.hidden;if(!n.hidden)$i('hl-tl').focus();return}

      if(!bo)alert('Lần chấm này đã chuyển vào hồ sơ. Xóa ở hồ sơ, mục Lớp học.');ve();return}

  });

  /* ---- gọi tên ngẫu nhiên: không lặp lại trong cùng bài, cùng ngày, đến khi gọi hết lớp ---- */

  function dongOv(){if(OV){clearTimeout(OV.tq);OV.el.remove();OV=null;if(!pan.hidden)ve()}}

    var ds=lops()[LOP]||[];
    if(!ds.length){moPan(true);var n=$i('hl-nhap');if(n){n.hidden=false;$i('hl-tl').focus()}bao('Chọn lớp hoặc nhập danh sách lớp trước.');return}
    var b=bg(),g=b.goi[LOP];if(!g||g.ngay!==homNay()||g.ma!==MA)g={ngay:homNay(),ma:MA,ds:[]};
    var con=ds.filter(function(n){return g.ds.indexOf(n)<0});if(!con.length){g.ds=[];con=ds.slice()}
    var chon=con[Math.floor(Math.random()*con.length)];g.ds.push(chon);sua(function(o){o.goi[LOP]=g});
    moCham(chon,true,ds);
  }
  function moCham(ten,quay,ds){
    dongOv();
    var el=document.createElement('div');el.className='hl-ov';
    el.innerHTML='<div class="hl-the" role="dialog" aria-label="Gọi tên"><div class="hl-lop">'+esc(LOP)+(quay?' · gọi ngẫu nhiên':' · xung phong')+'</div><div class="hl-ten'+(quay?' quay':'')+'" aria-live="polite"></div>'+
      '<div class="r" id="hl-cham" '+(quay?'hidden':'')+'><button class="d1" data-d="1">+1 Tốt</button><button class="d2" data-d="0.5">+0,5 Được</button><button class="d0" data-d="0">0 Chưa đạt</button></div>'+
      '<div class="r"><button data-k="khac">🎲 Gọi em khác</button><button data-k="bo">Bỏ qua (Esc)</button></div><div class="hl-tb" role="status"></div></div>';
    document.body.appendChild(el);OV={el:el,tq:0};
    var o=el.querySelector('.hl-ten');
    function xong(){o.textContent=ten;o.classList.remove('quay');var c=el.querySelector('#hl-cham');if(c)c.hidden=false;vui();var b1=el.querySelector('.d1');if(b1)b1.focus()}
    if(quay&&ds&&ds.length>1){var k=0,buoc=[50,50,50,60,60,70,80,90,110,130,160,200,250];
      (function lan(){if(!OV||OV.el!==el)return;if(k>=buoc.length)return xong();o.textContent=ds[Math.floor(Math.random()*ds.length)];tach();OV.tq=setTimeout(lan,buoc[k++])})()}
    else xong();
    el.addEventListener('click',function(e){
      if(e.target===el){tach();return dongOv()}
      var t=e.target.closest('button');if(!t)return;
      if(t.hasAttribute('data-d')){var d=+t.getAttribute('data-d');
        sua(function(x){x.pv.push({lop:LOP,hs:ten,ngay:homNay(),bai:MA,slide:slideSo(),diem:d})});
        el.querySelector('.hl-tb').textContent='Đã ghi: '+ten+' '+(d===1?'+1':d===.5?'+0,5':'0');
        el.querySelector('#hl-cham').hidden=true;d>0?vui():tach();setTimeout(function(){if(OV&&OV.el===el)dongOv();if(!pan.hidden)ve()},900);return}
      tach();
      if(t.getAttribute('data-k')==='khac'){if(quay)return goiTen();dongOv();return goiTen()}
      if(t.getAttribute('data-k')==='bo'){dongOv();if(!pan.hidden)ve()}
    });
  }

  /* ---- bấm giờ đếm ngược ---- */
  var GIO={con:0,tm:null,hien:false};
  var oGio=document.createElement('div');oGio.id='hl-gio';oGio.hidden=true;oGio.title='Bấm để tạm dừng hoặc chạy tiếp';oGio.setAttribute('role','timer');document.body.appendChild(oGio);
  oGio.onclick=function(){tach();if(GIO.tm)dungGio();else if(GIO.con>0)chay();else{GIO.hien=false;oGio.hidden=true}if(!pan.hidden)ve()};
  function hienGio(){var s=Math.max(0,GIO.con);oGio.textContent=(GIO.tm?'⏱ ':'⏸ ')+Math.floor(s/60)+':'+('0'+s%60).slice(-2);
    oGio.classList.toggle('gan',s>0&&s<=10);oGio.classList.toggle('het',s===0);if(s===0)oGio.textContent='⏰ Hết giờ'}
  function dungGio(){if(GIO.tm){clearInterval(GIO.tm);GIO.tm=null}hienGio()}
  function chay(){if(GIO.tm)return;GIO.tm=setInterval(function(){GIO.con--;if(GIO.con<=0){GIO.con=0;dungGio();chuong();if(!pan.hidden)ve();return}if(GIO.con<=5)tieng(990,.08,.1);hienGio()},1000);hienGio()}
  function batGio(s){dungGio();GIO.con=s;GIO.hien=true;oGio.hidden=false;chay();ve()}

  /* ---- chia nhóm ngẫu nhiên ---- */
  function chiaNhom(n){
    var ds=(lops()[LOP]||[]).slice();if(!ds.length)return;
    for(var i=ds.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=ds[i];ds[i]=ds[j];ds[j]=t}
    n=Math.min(n,ds.length);var nh=[];for(i=0;i<n;i++)nh.push([]);ds.forEach(function(x,k){nh[k%n].push(x)});
    dongOv();var el=document.createElement('div');el.className='hl-ov';
    el.innerHTML='<div class="hl-the" style="min-width:min(900px,94vw)"><div class="hl-lop">'+esc(LOP)+' · '+n+' nhóm</div><div class="hl-nhom">'+nh.map(function(g,k){return'<div><b>Nhóm '+(k+1)+'</b>'+g.map(esc).join('<br>')+'</div>'}).join('')+'</div><div class="r"><button data-k="lai">🎲 Chia lại</button><button class="c" data-k="bo">Đóng (Esc)</button></div></div>';
    document.body.appendChild(el);OV={el:el,tq:0};vui();
    el.addEventListener('click',function(e){var t=e.target.closest('button');if(e.target===el||(t&&t.getAttribute('data-k')==='bo')){tach();dongOv()}else if(t&&t.getAttribute('data-k')==='lai'){tach();chiaNhom(n)}});
  }
})();</script>
