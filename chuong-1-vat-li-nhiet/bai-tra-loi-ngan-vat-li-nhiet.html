<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luyện trả lời ngắn Vật lí nhiệt</title>
<style>
:root{
  --bg:#fdf8f3;--card:#ffffff;--ink:#2a2320;--muted:#6f625a;--line:#eadfd5;
  --accent:#e2571f;--accent-soft:#fde6da;--ok:#1b7f4b;--ok-bg:#dff5e8;--bad:#b3261e;--bad-bg:#fbe1de;--cool:#2b6cb0;--cool-bg:#e3eefa;--shadow:0 2px 10px rgba(80,40,10,.08);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1b1613;--card:#262019;--ink:#f3ebe4;--muted:#b3a499;--line:#3a3028;--accent:#ff8a4d;--accent-soft:#3d2618;--ok:#5fd493;--ok-bg:#163523;--bad:#ff8a80;--bad-bg:#431c1a;--cool:#7db7f2;--cool-bg:#1b2b3d;--shadow:none}
}
:root[data-theme="dark"]{--bg:#1b1613;--card:#262019;--ink:#f3ebe4;--muted:#b3a499;--line:#3a3028;--accent:#ff8a4d;--accent-soft:#3d2618;--ok:#5fd493;--ok-bg:#163523;--bad:#ff8a80;--bad-bg:#431c1a;--cool:#7db7f2;--cool-bg:#1b2b3d;--shadow:none}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{max-width:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro","Inter","Segoe UI",system-ui,sans-serif;line-height:1.6;font-size:16px}
body.big{font-size:20px}
.card,.stem,.sol,.hint,td,th,li,p,h1,h2,h3{overflow-wrap:anywhere}
header.top{background:var(--card);border-bottom:1px solid var(--line)}
.stick{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
section.card{scroll-margin-top:64px}
img,svg,canvas{max-width:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;max-width:1100px;margin:auto}
.brand{font-weight:700;color:var(--accent);margin-right:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:6px 12px;font:inherit;font-size:.85em;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.tool{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:.85em;cursor:pointer}
.who{font-size:.85em;color:var(--muted)}
.progress{height:4px;background:var(--line)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f5a623,#e2571f);transition:width .3s}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:1100px;margin:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 12px;font:inherit;font-size:.85em;cursor:pointer}
nav.tabs button.on{background:var(--tc,var(--accent));color:#fff;border-color:transparent}
nav.tabs button.done::after{content:"✓";margin-left:6px;font-weight:700}
main{max-width:1100px;margin:auto;padding:16px}
h1,h2,h3{line-height:1.25}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 16px;box-shadow:var(--shadow)}
.gh{border-left:8px solid var(--tc)}
.gh h2{margin:0 0 4px;color:var(--tc)}
.chip{display:inline-block;font-size:.75em;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);font-weight:600;margin-right:6px}
.chip.fig{background:var(--cool-bg);color:var(--cool)}
.qhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.qhead h3{margin:0;font-size:1.05em}
.stem{margin:8px 0 12px}
.stem b.kw{background:var(--accent-soft);padding:0 3px;border-radius:4px}
.note{color:var(--muted);font-size:.9em;margin-top:6px}
.ansrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.ansrow label{font-weight:700;color:var(--accent)}
.ansrow input{flex:1 1 150px;min-width:110px;max-width:240px;padding:9px 12px;font:inherit;font-size:1.05em;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.ansrow input:focus{outline:none;border-color:var(--accent)}
.ansrow .unit{color:var(--muted);font-weight:600}
.ansrow.ok{border-color:var(--ok);background:var(--ok-bg)}
.ansrow.bad{border-color:var(--bad);background:var(--bad-bg)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:8px 16px;font:inherit;cursor:pointer;font-weight:600}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.score{margin-left:auto;font-weight:700}
.hint{background:var(--cool-bg);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:.95em}
.banner{margin-top:10px;border-radius:10px;padding:10px 12px;font-weight:700;border:1px solid}
.banner.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.banner.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.sol{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:.96em}
.sol .final{font-weight:700;color:var(--cool);margin-top:4px}
.sol .tnote{margin-top:6px;color:var(--bad);font-weight:600}
table.data{border-collapse:collapse;margin:8px 0;font-size:.95em;max-width:100%;display:block;overflow-x:auto}
table.data th,table.data td{border:1px solid var(--line);padding:4px 10px;text-align:center}
table.data th{background:var(--accent-soft)}
.fig{margin:8px 0;text-align:center}
.fig svg{max-width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
.fig small{display:block;color:var(--muted)}
.formula{font-family:Cambria,"Times New Roman",serif;background:var(--accent-soft);border-radius:8px;padding:2px 8px}
.bars .b{display:flex;align-items:center;gap:8px;margin:6px 0}
.bars .b span.n{width:70px}
.bars .b .t{flex:1;background:var(--line);border-radius:6px;height:20px;overflow:hidden}
.bars .b .t i{display:block;height:100%;background:var(--tc)}
.bars .b span.v{width:70px;text-align:right}
table.sum{width:100%;border-collapse:collapse}
table.sum td,table.sum th{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.wrong a{cursor:pointer;color:var(--cool);text-decoration:underline}
[hidden]{display:none!important}
#gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.gatebox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:420px;width:100%;box-shadow:var(--shadow)}
.gatebox h1{margin:0 0 6px;font-size:1.25em;color:var(--accent)}
.gchoice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.gbtn{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:14px 8px;font:inherit;font-weight:700;cursor:pointer;min-height:64px}
.gbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.gatebox label{display:block;font-weight:600;margin:8px 0}
.gatebox input{width:100%;padding:10px 12px;font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-top:4px}
.err{color:var(--bad);font-weight:600;margin:6px 0}
@media (max-width:600px){
  body{font-size:15.5px}
  main{padding:10px}.card{padding:12px;border-radius:12px;margin-bottom:12px}
  .bar{padding:8px 10px;gap:6px}
  .brand{flex:1 1 100%;font-size:.95em;margin:0}
  .seg{flex:1 1 100%}.seg button{flex:1;padding:9px 4px;font-size:.9em}
  .tool{flex:1 1 30%;padding:8px 6px;font-size:.8em;white-space:nowrap}
  nav.tabs{padding:6px 10px}nav.tabs button{padding:9px 12px;font-size:.9em}
  .ansrow input{max-width:none}
  .btn{min-height:42px;padding:9px 14px}
  .acts{gap:6px}.acts .btn{flex:1 1 auto}
  .score{margin-left:0;width:100%}
  table.sum td,table.sum th{display:block;padding:3px 0}table.sum tr{display:block;padding:6px 0;border-bottom:1px solid var(--line)}
  h1{font-size:1.35em}
}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand">🔥 Luyện trả lời ngắn · Vật lí 12 · Vật lí nhiệt</div>
    <div class="seg" id="roleSeg" role="group" aria-label="Vai trò"><button type="button" data-role="teacher">Giáo viên</button><button type="button" data-role="student">Học sinh</button></div>
    <span class="who" id="whoami"></span>
    <button class="tool" id="ansBtn" hidden>Đáp án: Hiện</button>
    <button class="tool" id="voiceBtn" aria-pressed="true">🔊 Giọng: Bật</button>
    <button class="tool" id="bigBtn" aria-pressed="false">Chữ to</button>
    <button class="tool" id="themeBtn">Sáng/Tối</button>
  </div>
</header>
<div class="stick">
  <div class="progress"><i id="prog"></i></div>
  <nav class="tabs" id="tabs" aria-label="Điều hướng"></nav>
</div>
<main id="view"></main>
<div id="gate" role="dialog" aria-modal="true" aria-label="Chọn chế độ" hidden>
  <div class="gatebox">
    <h1>🔥 Luyện trả lời ngắn · Vật lí 12</h1>
    <div>Chọn chế độ để bắt đầu</div>
    <div class="gchoice"><button type="button" class="gbtn" data-pick="student">👩‍🎓<br>Học sinh</button><button type="button" class="gbtn" data-pick="teacher">👩‍🏫<br>Giáo viên</button></div>
    <form id="fStudent" hidden><label>Nhập tên của em<input id="inName" maxlength="40" autocomplete="name" placeholder="Ví dụ: Nguyễn Văn A"></label><button class="btn" type="submit" style="width:100%">Vào làm bài</button></form>
    <form id="fTeacher" hidden><label>Mật khẩu giáo viên<input id="inPass" type="password" autocomplete="off"></label><div class="err" id="passErr" hidden>Mật khẩu chưa đúng.</div><button class="btn" type="submit" style="width:100%">Đăng nhập</button></form>
    <div style="margin-top:10px"><button type="button" class="btn alt" id="gateCancel" hidden style="width:100%">Hủy</button></div>
  </div>
</div>

<script>
/* =====================================================================
   DỮ LIỆU CÂU HỎI — nguồn: "Lời giải chi tiết – Chương I – Trả lời ngắn (Bản 1)".
   Mỗi câu: b (bài), n (số câu), t (chủ đề), q (đề, HTML), a (đáp số, dùng dấu phẩy thập phân),
   u (đơn vị hiển thị), x (1 = phải đúng chính xác, vd. đếm số phát biểu), ref (1 = đề gốc có kèm các phát biểu),
   fig (tên hình/bảng trong FIG), h (gợi ý), s (các dòng lời giải), tn (ghi chú dành riêng cho giáo viên)
   ===================================================================== */
const BAI=[
 {n:1,c:"#e2571f",t:"Cấu trúc của chất. Sự chuyển thể"},
 {n:2,c:"#d98a00",t:"Nội năng. Định luật I của nhiệt động lực học"},
 {n:3,c:"#2b6cb0",t:"Nhiệt độ. Thang nhiệt độ – Nhiệt kế"},
 {n:4,c:"#0f766e",t:"Nhiệt dung riêng"},
 {n:5,c:"#6d28d9",t:"Nhiệt nóng chảy riêng"},
 {n:6,c:"#b83280",t:"Nhiệt hóa hơi riêng"}
];

const Q=[
/* ============ BÀI 1 ============ */
{b:1,n:1,t:"Phát biểu không đúng về mô hình động học phân tử",ref:1,x:1,u:"phát biểu",a:"1",
 q:"Có bao nhiêu phát biểu <b class=\"kw\">KHÔNG</b> đúng với mô hình động học phân tử (trong 5 phát biểu của đề)?",
 h:"Nhiệt độ liên quan tới tốc độ phân tử, không liên quan thể tích vật.",
 s:["Xét từng phát biểu:","(1) Đúng: chất cấu tạo từ các hạt riêng biệt là phân tử.","(2) SAI: tốc độ chuyển động của phân tử càng lớn thì nhiệt độ vật càng cao; không suy ra thể tích vật càng lớn.","(3) Đúng: giữa các phân tử có cả lực hút và lực đẩy, gọi chung là lực liên kết phân tử.","(4) Đúng: phân tử sắp xếp trật tự (chất rắn) thì khoảng cách nhỏ, lực liên kết mạnh.","(5) Đúng: khoảng cách giữa các phân tử càng lớn thì lực liên kết càng yếu.","Chỉ có 1 phát biểu sai."]},
{b:1,n:2,t:"Đếm phát biểu đúng về chuyển thể",ref:1,x:1,u:"phát biểu",a:"3",
 q:"Có bao nhiêu phát biểu <b class=\"kw\">đúng</b> trong 5 phát biểu của đề?",
 h:"Khi chất rắn kết tinh đang nóng chảy, nhiệt độ có tăng không? Hóa hơi gồm những hình thức nào?",
 s:["(1) Đúng.","(2) Đúng: nhận nhiều năng lượng thì chuyển động nhanh hơn, liên kết yếu đi.","(3) Đúng: chuyển thể luôn kèm trao đổi năng lượng (thu hoặc tỏa nhiệt).","(4) SAI: khi chất rắn kết tinh đang nóng chảy, nhiệt độ không đổi (không “luôn tăng”).","(5) SAI: sự hóa hơi gồm bay hơi (xảy ra ở mọi nhiệt độ) và sôi (ở nhiệt độ sôi xác định).","Có 3 phát biểu đúng: (1), (2), (3)."]},
{b:1,n:3,t:"Chuyển động Brown",ref:1,x:1,u:"phát biểu",a:"1",
 q:"Về chuyển động Brown, có bao nhiêu phát biểu <b class=\"kw\">KHÔNG</b> đúng (trong 4 phát biểu của đề)?",
 h:"Chuyển động Brown là chuyển động của hạt nào?",
 s:["(1) Đúng: hạt phấn hoa bị các phân tử nước chuyển động hỗn loạn va chạm từ nhiều phía nên chuyển động hỗn loạn.","(2) Đúng: đây là bằng chứng gián tiếp về chuyển động hỗn loạn không ngừng của phân tử.","(3) Đúng: nhiệt độ tăng, hạt phấn chuyển động nhanh hơn, chứng tỏ tốc độ phân tử tăng theo nhiệt độ.","(4) SAI: chuyển động Brown là chuyển động của các hạt phấn hoa (hạt nhỏ lơ lửng), không phải chuyển động của phân tử nước.","Có 1 phát biểu sai."]},
/* ============ BÀI 2 ============ */
{b:2,n:1,t:"Nén khí, tỏa nhiệt",u:"J",a:"160",
 q:"Thực hiện công <b>200 J</b> nén khí; khí truyền ra môi trường <b>40 J</b>. Tính độ biến thiên nội năng ΔU.",
 h:"ΔU = A + Q; nhận công A &gt; 0, tỏa nhiệt Q &lt; 0.",
 s:["Định luật I: ΔU = A + Q.","Khí nhận công: A = +200 J; khí tỏa nhiệt: Q = −40 J.","ΔU = 200 − 40 = 160 J."]},
{b:2,n:2,t:"Lực ma sát của pit-tông",u:"N",a:"20",
 q:"Cung cấp Q = 1,5 J cho khí trong xilanh nằm ngang; pit-tông chuyển động <b>thẳng đều</b> sang phải 5,0 cm; ΔU = 0,5 J. Tìm độ lớn lực ma sát.",
 h:"Công khí sinh ra A' = Q − ΔU; chuyển động đều nên A' = F<sub>ms</sub>·s.",
 s:["Khí nhận nhiệt Q = 1,5 J và sinh công A' nên: ΔU = Q − A' ⇒ A' = Q − ΔU = 1,5 − 0,5 = 1,0 J.","Pit-tông chuyển động thẳng đều ⇒ công khí sinh ra bằng công thắng lực ma sát (bỏ qua áp suất khí quyển): A' = F<sub>ms</sub>·s.","F<sub>ms</sub> = A'/s = 1,0 / 0,05 = 20 N."]},
{b:2,n:3,t:"Viên đạn xuyên tấm thép",u:"J",a:"480",
 q:"Viên đạn chì m = 100 g, v₀ = 360 km/h xuyên qua tấm thép, còn lại v = 72 km/h. Nội năng của đạn và thép tăng bao nhiêu?",
 h:"Đổi km/h ra m/s; động năng mất đi biến thành nội năng.",
 s:["Đổi: v₀ = 360 km/h = 100 m/s; v = 72 km/h = 20 m/s; m = 0,1 kg.","Động năng mất đi chuyển hóa hoàn toàn thành nội năng của đạn và thép.","ΔU = ½m(v₀² − v²) = ½·0,1·(100² − 20²) = 0,05·9600 = 480 J."]},
{b:2,n:4,t:"Vật trượt trên mặt phẳng nghiêng",u:"J",a:"94,5",
 q:"Vật 1 kg trượt không vận tốc đầu từ đỉnh xuống chân mặt phẳng nghiêng dài 21 m, nghiêng 30°; tốc độ ở chân dốc 4,1 m/s; g = 9,8 m/s². Bỏ qua trao đổi nhiệt. Tính độ biến thiên nội năng (làm tròn 1 chữ số thập phân).",
 h:"Cơ năng giảm đi một lượng bằng ΔU: mgh − ½mv².",
 s:["Độ cao: h = l·sin30° = 21·0,5 = 10,5 m.","Thế năng ban đầu: W<sub>t</sub> = mgh = 1·9,8·10,5 = 102,9 J.","Động năng ở chân dốc: W<sub>đ</sub> = ½mv² = ½·1·4,1² = 8,405 J.","Cơ năng giảm chuyển thành nội năng (do ma sát): ΔU = 102,9 − 8,405 = 94,495 J ≈ 94,5 J."]},
{b:2,n:5,t:"Hiệu suất động cơ nhiệt",u:"%",a:"20",
 q:"Động cơ nhiệt nhận Q₁ = 1,5·10⁶ J từ nguồn nóng, truyền cho nguồn lạnh Q₂ = 1,2·10⁶ J. Tính hiệu suất (%).",
 h:"A = Q₁ − Q₂; H = A/Q₁.",
 s:["Công có ích: A = Q₁ − Q₂ = 1,5·10⁶ − 1,2·10⁶ = 0,3·10⁶ J.","H = A/Q₁ = 0,3/1,5 = 0,2 = 20%."]},
{b:2,n:6,t:"Khí nhận nhiệt và sinh công",u:"J",a:"500",
 q:"Truyền cho khí nhiệt lượng Q = 2000 J; khí dãn nở và thực hiện công 1500 J. Tính ΔU.",
 h:"Khí sinh công thì A mang dấu âm.",
 s:["Khí nhận nhiệt: Q = +2000 J; khí sinh công: A = −1500 J.","ΔU = Q + A = 2000 − 1500 = 500 J."]},
{b:2,n:7,t:"Dãn đẳng áp",u:"MJ",a:"1,2",
 q:"Truyền Q = 6·10⁶ J cho khí trong xilanh; thể tích tăng 0,6 m³; áp suất p = 8·10⁶ N/m² không đổi. Tính ΔU (đơn vị MJ).",
 h:"Công khí sinh ra khi p không đổi: A' = pΔV.",
 s:["Công khí sinh ra khi dãn đẳng áp: A' = pΔV = 8·10⁶·0,6 = 4,8·10⁶ J.","ΔU = Q − A' = 6·10⁶ − 4,8·10⁶ = 1,2·10⁶ J = 1,2 MJ."]},
{b:2,n:8,t:"Khí dãn nở ở áp suất không đổi",u:"kJ",a:"1,23",
 q:"Khí nhận Q = 4,98 kJ, dãn nở làm thể tích tăng ΔV = 15 dm³ ở áp suất không đổi p = 2,5·10⁵ Pa. Tính ΔU (kJ, 2 chữ số sau dấu phẩy).",
 h:"Đổi 15 dm³ = 15·10⁻³ m³.",
 s:["ΔV = 15 dm³ = 15·10⁻³ m³.","A' = pΔV = 2,5·10⁵·15·10⁻³ = 3750 J = 3,75 kJ.","ΔU = Q − A' = 4,98 − 3,75 = 1,23 kJ."]},
{b:2,n:9,t:"Nén khí, tỏa nhiệt (số liệu khác)",u:"J",a:"70",
 q:"Thực hiện công <b>100 J</b> nén khí; khí truyền ra môi trường <b>30 J</b>. Tính ΔU.",
 h:"A = +100 J; Q = −30 J.",
 s:["A = +100 J (nhận công); Q = −30 J (tỏa nhiệt).","ΔU = A + Q = 100 − 30 = 70 J."]},
/* ============ BÀI 3 ============ */
{b:3,n:1,t:"Thang Celsius bằng một nửa thang Kelvin",u:"°C",a:"273",
 q:"Ở nhiệt độ bao nhiêu °C thì số đo theo thang Celsius bằng <b>một nửa</b> số đo theo thang Kelvin?",
 h:"T = t + 273 và t = T/2.",
 s:["Theo đề: t = T/2 với T = t + 273.","t = (t + 273)/2 ⇒ 2t = t + 273 ⇒ t = 273 °C."]},
{b:3,n:2,t:"Nhiệt độ – truyền nhiệt – nhiệt kế",ref:1,x:1,u:"phát biểu",a:"3",
 q:"Có bao nhiêu phát biểu <b class=\"kw\">KHÔNG</b> đúng trong 6 phát biểu của đề?",
 h:"Nhiệt truyền theo chiều chênh lệch nhiệt độ; nhiệt kế rượu, thủy ngân dùng chất lỏng nở vì nhiệt.",
 s:["(1) SAI: nhiệt truyền từ vật có NHIỆT ĐỘ cao sang vật nhiệt độ thấp, không phụ thuộc nội năng lớn hay nhỏ.","(2) SAI: cân bằng nhiệt là nhiệt độ bằng nhau, không liên quan số phân tử.","(3) Đúng.","(4) SAI: nhiệt kế rượu, thủy ngân dựa trên sự nở vì nhiệt của chất LỎNG.","(5) Đúng.","(6) Đúng (nhiệt điện trở).","Có 3 phát biểu sai: (1), (2), (4)."]},
{b:3,n:3,t:"So sánh bếp điện và ấm điện (tiền điện)",u:"đồng",a:"2773",
 q:"Giá điện 2025: 50 đồng/kWh. Bếp điện hiệu suất 70%, mỗi ngày đun 40 phích × 1,8 lít nước (20 °C → sôi 100 °C). Nếu mua ấm điện hiệu suất 90% thì mỗi tháng (26 ngày) tiết kiệm được bao nhiêu tiền? (c = 4200 J/kg.K, 1 lít = 1 kg, 1 kWh = 3,6·10⁶ J)",
 h:"Tính Q cho 1 ngày, rồi điện năng = Q/H cho mỗi loại, đổi ra kWh.",
 s:["Nhiệt cần cho 1 ngày: Q = mcΔt = (40·1,8)·4200·(100 − 20) = 72·4200·80 = 24 192 000 J.","Điện năng với bếp 70%: A₁ = Q/0,7 = 34 560 000 J = 9,6 kWh.","Điện năng với ấm 90%: A₂ = Q/0,9 = 26 880 000 J ≈ 7,4667 kWh.","Tiết kiệm mỗi ngày: 9,6 − 7,4667 = 2,1333 kWh; 26 ngày: 55,467 kWh.","Tiền tiết kiệm: 55,467·50 ≈ 2773 đồng."]},
{b:3,n:4,t:"Nhiệt lượng nước trà tỏa ra",u:"kJ",a:"14,7",
 q:"Rót 0,05 kg nước trà ở 80 °C vào cốc, cho m (g) đá ở 0 °C; cuối cùng hỗn hợp ở 10 °C. c<sub>nước</sub> = 4,2 kJ/kg.K; λ<sub>đá</sub> = 3,33·10⁵ J/kg. Tính nhiệt lượng nước trà tỏa ra khi hạ từ 80 °C xuống 10 °C (kJ, 1 chữ số thập phân).",
 h:"Q = mcΔt với Δt = 80 − 10.",
 s:["Q<sub>tỏa</sub> = mcΔt = 0,05·4200·(80 − 10) = 14 700 J = 14,7 kJ."]},
{b:3,n:5,t:"Khối lượng đá cho vào cốc trà",u:"g",a:"35,3",
 q:"(Dữ kiện câu trước: 0,05 kg trà 80 °C, đá 0 °C, hỗn hợp cuối 10 °C, λ<sub>đá</sub> = 3,33·10⁵ J/kg, c = 4200 J/kg.K.) Hao phí ra môi trường là 10%. Tìm khối lượng đá m (g, 1 chữ số thập phân).",
 h:"Nhiệt đá thu = 90% nhiệt trà tỏa; đá vừa nóng chảy vừa nóng lên 0 → 10 °C.",
 s:["Nhiệt đá thu vào = 90% nhiệt trà tỏa: Q<sub>thu</sub> = 0,9·14 700 = 13 230 J.","Đá thu nhiệt để nóng chảy rồi nước đá tan nóng lên từ 0 °C đến 10 °C: Q<sub>thu</sub> = m(λ + cΔt) = m(3,33·10⁵ + 4200·10) = m·375 000.","m = 13 230/375 000 = 0,03528 kg ≈ 35,3 g."]},
{b:3,n:6,t:"Nhiệt độ sôi theo Kelvin (đồ thị)",fig:"t36",u:"K",a:"353",
 q:"Đồ thị nhiệt độ – thời gian của một chất lỏng được đun bằng nguồn công suất không đổi (c<sub>lỏng</sub> = 2800 J/kg.K). Tính nhiệt độ sôi theo thang <b>Kelvin</b>.",
 h:"Đoạn nằm ngang của đồ thị ứng với quá trình sôi.",
 s:["Đọc đồ thị: đoạn nằm ngang (nhiệt độ không đổi) ứng với quá trình sôi, tại t = 80 °C.","T = t + 273 = 80 + 273 = 353 K."]},
{b:3,n:7,t:"Nhiệt hóa hơi riêng từ đồ thị",fig:"t36",u:"MJ/kg",a:"0,28",
 q:"(Đồ thị như câu trước, c<sub>lỏng</sub> = 2800 J/kg.K.) Tính nhiệt hóa hơi riêng của chất này (MJ/kg, 2 chữ số thập phân).",
 h:"Cùng công suất P: đoạn nóng lên cho P/m; đoạn sôi cho L = (P/m)·t.",
 tn:"⚠ File gốc ghi 0,39 MJ/kg là SAI (do lấy thời gian sôi 35 s). Đồ thị này trùng với đồ thị Bài 6 câu 5–6, đáp án đúng là 0,28.",
 s:["Đọc đồ thị: đun nóng từ 20 °C → 80 °C trong 15 s; sôi (đoạn ngang) từ 15 s đến 40 s, tức 25 s (mỗi ô ngang = 5 s, đoạn ngang dài 5 ô).","Công suất truyền nhiệt: P·15 = mc(80 − 20) ⇒ P/m = 2800·60/15 = 11 200 W/kg.","Hóa hơi: P·25 = mL ⇒ L = 11 200·25 = 2,8·10⁵ J/kg = 0,28 MJ/kg."]},
{b:3,n:8,t:"Nhiệt độ mùa đông ở New York",u:"°C",a:"-10",
 q:"Nhiệt độ mùa đông tại New York là 263 K, ứng với bao nhiêu °C?",
 h:"t = T − 273.",
 s:["t = T − 273 = 263 − 273 = −10 °C."]},
{b:3,n:9,t:"Nhiệt độ đông đặc (bảng số liệu)",fig:"pdb",u:"°C",a:"53",
 q:"Đo nhiệt độ của paradichlorobenzene nguội dần, thu được bảng số liệu. Tìm nhiệt độ đông đặc của chất này.",
 h:"Chất rắn kết tinh đông đặc thì nhiệt độ thế nào?",
 s:["Chất rắn kết tinh khi đông đặc thì nhiệt độ không đổi.","Trong bảng, nhiệt độ giữ nguyên 53 °C từ giây thứ 3 đến thứ 7 ⇒ đó là nhiệt độ đông đặc."]},
/* ============ BÀI 4 ============ */
{b:4,n:1,t:"Đo nhiệt dung riêng của nước (đồ thị)",u:"J/(kg.K)",a:"4256",
 q:"Thí nghiệm đo nhiệt dung riêng của nước: m = 1,0 kg, công suất oát kế 950 W. Đồ thị t(τ) có điểm M (τ = 32 s; 35 °C) và N (τ = 144 s; 60 °C). Tính c của nước nếu chỉ có dây điện trở và nước trao đổi nhiệt.",
 h:"Q = PΔτ = mcΔt.",
 s:["Đọc đồ thị: Δt = 60 − 35 = 25 K; Δτ = 144 − 32 = 112 s.","Nhiệt điện trở tỏa ra: Q = P·Δτ = 950·112 = 106 400 J.","Q = mcΔt ⇒ c = Q/(mΔt) = 106 400/(1·25) = 4256 J/(kg.K)."]},
{b:4,n:2,t:"Nhiệt dung riêng khi có hao phí",u:"J/(kg.K)",a:"4179",
 q:"(Dữ kiện câu trước: m = 1,0 kg; P = 950 W; M (32 s; 35 °C), N (144 s; 60 °C).) Nếu hao phí nhiệt do môi trường và bình nhiệt lượng kế là <b>1,8%</b> thì c của nước là bao nhiêu? (làm tròn đến hàng đơn vị)",
 h:"Nhiệt thực sự truyền cho nước là 98,2% nhiệt tỏa ra.",
 s:["Nhiệt thực sự truyền cho nước là 98,2% nhiệt tỏa ra: Q<sub>nước</sub> = 0,982·106 400 = 104 484,8 J.","c = Q<sub>nước</sub>/(mΔt) = 104 484,8/25 ≈ 4179,4 ≈ 4179 J/(kg.K)."]},
{b:4,n:3,t:"Nhiệt độ lò nung (Kelvin)",u:"K",a:"1080",
 q:"Miếng sắt 50 g nung trong lò rồi thả vào nhiệt lượng kế vỏ thép 150 g chứa 0,7 kg nước 20 °C; cân bằng ở 26 °C. c<sub>sắt</sub> = c<sub>thép</sub> = 460, c<sub>nước</sub> = 4180 J/kg.K. Tính nhiệt độ của lò theo <b>Kelvin</b> (làm tròn đến hàng chục).",
 h:"Q<sub>tỏa</sub> (sắt) = Q<sub>thu</sub> (nước + vỏ thép); đổi sang K ở bước cuối.",
 s:["Phương trình cân bằng nhiệt: Q<sub>tỏa</sub> = Q<sub>thu</sub>.","m<sub>s</sub>c<sub>s</sub>(t − 26) = (m<sub>n</sub>c<sub>n</sub> + m<sub>t</sub>c<sub>t</sub>)(26 − 20)","0,05·460·(t − 26) = (0,7·4180 + 0,15·460)·6 = 2995·6 = 17 970 J","23(t − 26) = 17 970 ⇒ t − 26 ≈ 781,3 ⇒ t ≈ 807,3 °C.","T = t + 273 ≈ 1080 K."]},
{b:4,n:4,t:"Nhiệt lượng đun nước thành hơi",u:"MJ",a:"25,7",
 q:"Ấm điện 2000 W đun 10 kg nước 25 °C đến khi hóa hơi hoàn toàn ở 100 °C; c = 4180 J/kg.K; L = 2,26·10⁶ J/kg; chỉ 80% điện năng dùng cho nước. Tính nhiệt lượng nước cần nhận (MJ, 1 chữ số thập phân).",
 h:"Q = mcΔt + mL.",
 s:["Nhiệt đun nước 25 → 100 °C: Q₁ = mcΔt = 10·4180·75 = 3 135 000 J.","Nhiệt hóa hơi: Q₂ = mL = 10·2,26·10⁶ = 22 600 000 J.","Q = Q₁ + Q₂ = 25 735 000 J ≈ 25,7 MJ."]},
{b:4,n:5,t:"Thời gian đun nước thành hơi",u:"giờ",a:"4,47",
 q:"(Dữ kiện câu trước: ấm 2000 W; hiệu suất 80%; nhiệt cần Q ≈ 25 735 000 J.) Tính thời gian đun (giờ, 2 chữ số thập phân).",
 h:"0,8·P·t = Q; đổi giây ra giờ.",
 s:["Điện năng hữu ích: 0,8·P·t = Q ⇒ t = Q/(0,8P) = 25 735 000/(0,8·2000) = 25 735 000/1600 ≈ 16 084 s.","Đổi ra giờ: 16 084/3600 ≈ 4,47 giờ."]},
{b:4,n:6,t:"Bình nóng lạnh: nhiệt lượng",u:"kJ",a:"1050",
 q:"Bình nóng lạnh 5 lít, 1500 W; nước vào 20 °C; c = 4200 J/kg.K; ρ = 1 kg/lít; rơ le ngắt khi nước đạt 70 °C. Tính nhiệt lượng làm nóng nước (kJ).",
 h:"m = 5 kg; Δt = 50 K.",
 s:["m = 5 lít·1 kg/lít = 5 kg.","Q = mcΔt = 5·4200·(70 − 20) = 1 050 000 J = 1050 kJ."]},
{b:4,n:7,t:"Bình nóng lạnh: thời gian (phút)",u:"phút",a:"11,7",
 q:"(Dữ kiện câu trước: 5 kg nước, 20 → 70 °C, P = 1500 W, c = 4200 J/kg.K.) Tính thời gian từ lúc bật đến khi rơ le ngắt (phút, 1 chữ số thập phân).",
 h:"Toàn bộ điện năng thành nhiệt: Pt = Q.",
 s:["Toàn bộ điện năng chuyển thành nhiệt cho nước: P·t = Q.","t = 1 050 000/1500 = 700 s = 700/60 ≈ 11,7 phút."]},
{b:4,n:8,t:"Ấm điện 500 W đun 300 g nước",u:"phút",a:"4,18",
 q:"Ấm điện 500 W chứa 300 g nước 20 °C; c = 4180 J/kg.K; hiệu suất 80%. Tính thời gian đun sôi (phút, 2 chữ số thập phân).",
 h:"H = Q/(P·t).",
 s:["Nhiệt cần: Q = mcΔt = 0,3·4180·80 = 100 320 J.","Hiệu suất: H = Q/(P·t) ⇒ t = Q/(HP) = 100 320/(0,8·500) = 250,8 s.","t = 250,8/60 ≈ 4,18 phút."]},
{b:4,n:9,t:"Hiệu suất bình siêu tốc",u:"%",a:"75,3",
 q:"Bình siêu tốc 1800 W đun 1,2 kg nước từ 27 °C, sôi sau 4,5 phút; c = 4180 J/kg.K. Tính hiệu suất (%, 1 chữ số thập phân).",
 h:"H = Q<sub>nước</sub>/(P·t).",
 s:["Nhiệt nước nhận: Q = 1,2·4180·(100 − 27) = 366 168 J.","Điện năng tiêu thụ: A = P·t = 1800·(4,5·60) = 1800·270 = 486 000 J.","H = Q/A = 366 168/486 000 ≈ 0,7534 ≈ 75,3%."]},
{b:4,n:10,t:"Bình nóng lạnh: thời gian (giây)",u:"s",a:"700",
 q:"Bình nóng lạnh 5 lít, 1500 W, nước vào 20 °C, rơ le ngắt ở 70 °C (c = 4200 J/kg.K, ρ = 1 kg/lít). Tính thời gian từ lúc bật đến khi ngắt (giây).",
 h:"t = Q/P.",
 s:["m = 5 kg; Q = mcΔt = 5·4200·50 = 1 050 000 J.","t = Q/P = 1 050 000/1500 = 700 s."]},
{b:4,n:11,t:"Đun dầu ô liu: nhiệt nồi nhôm nhận",u:"J",a:"7040",
 q:"Đun dầu ô liu trong nồi nhôm 0,2 kg, từ 20 °C đến 60 °C trong 10 phút; c<sub>dầu</sub> = 1970, c<sub>nhôm</sub> = 880 J/kg.K; bếp 500 W, hiệu suất 80%. Tính nhiệt lượng nồi nhôm nhận.",
 h:"Q = m·c·Δt cho riêng nồi nhôm.",
 s:["Q<sub>nồi</sub> = m·c·Δt = 0,2·880·(60 − 20) = 7040 J."]},
{b:4,n:12,t:"Đun dầu ô liu: khối lượng dầu",u:"kg",a:"2,96",
 q:"(Dữ kiện câu trước: nồi nhôm 0,2 kg; 20 → 60 °C trong 10 phút; bếp 500 W, H = 80%; c<sub>dầu</sub> = 1970, c<sub>nhôm</sub> = 880 J/kg.K.) Tính khối lượng dầu (kg, 2 chữ số thập phân).",
 h:"Nhiệt hữu ích = H·P·t, trừ phần nồi nhôm nhận.",
 s:["Nhiệt hữu ích bếp cung cấp: Q = H·P·t = 0,8·500·600 = 240 000 J.","Nhiệt cho dầu: Q<sub>dầu</sub> = 240 000 − 7040 = 232 960 J.","m<sub>dầu</sub> = Q<sub>dầu</sub>/(c·Δt) = 232 960/(1970·40) = 232 960/78 800 ≈ 2,96 kg."]},
{b:4,n:13,t:"Hệ nước nóng năng lượng Mặt Trời",u:"°C",a:"15,36",
 q:"Hệ nước nóng năng lượng Mặt Trời: hiệu suất 35%; cường độ bức xạ I = 800 W/m²; diện tích S = 3,2 m²; bồn 50 lít; c = 4200 J/kg.K; ρ = 1 kg/lít. Độ tăng nhiệt độ của nước sau 1 giờ là bao nhiêu °C?",
 h:"P = I·S; Q = 0,35·P·t = mcΔt.",
 s:["Công suất bức xạ nhận được: P = I·S = 800·3,2 = 2560 W.","Năng lượng sau 1 h: E = 2560·3600 = 9 216 000 J.","Nhiệt nước nhận: Q = 0,35·E = 3 225 600 J.","m = 50 kg ⇒ Δt = Q/(mc) = 3 225 600/(50·4200) = 15,36 °C."]},
{b:4,n:14,t:"Tỉ số nhiệt dung riêng c₁/c₂",x:1,u:"",a:"1",
 q:"Hai vật có m₁ = 2m₂ truyền nhiệt cho nhau; khi cân bằng, độ biến thiên nhiệt độ Δt₂ = 2Δt₁. Tìm tỉ số c₁/c₂.",
 h:"m₁c₁Δt₁ = m₂c₂Δt₂.",
 s:["Nhiệt tỏa = nhiệt thu: m₁c₁Δt₁ = m₂c₂Δt₂.","⇒ c₁/c₂ = (m₂Δt₂)/(m₁Δt₁) = (1/2)·2 = 1."]},
{b:4,n:15,t:"Công suất bếp đun ấm nước nhôm",u:"W",a:"826",
 q:"2 lít nước 25 °C trong ấm nhôm 800 g, đun 40 phút thì 20% nước hóa hơi ở 100 °C; 80% nhiệt bếp cung cấp dùng đun nước và ấm; c<sub>nước</sub> = 4190, c<sub>nhôm</sub> = 880 J/kg.K, L = 2,26·10⁶ J/kg. Tính công suất bếp (làm tròn đến hàng đơn vị).",
 h:"Cộng 3 phần nhiệt: đun nước, đun ấm, hóa hơi 20% nước.",
 s:["m<sub>nước</sub> = 2 kg. Nhiệt đun nước 25 → 100 °C: 2·4190·75 = 628 500 J.","Nhiệt đun ấm nhôm: 0,8·880·75 = 52 800 J.","Nhiệt hóa hơi 20% nước (0,4 kg): 0,4·2,26·10⁶ = 904 000 J.","Tổng nhiệt có ích: Q = 628 500 + 52 800 + 904 000 = 1 585 300 J.","Nhiệt bếp cung cấp: Q/0,8 = 1 981 625 J trong t = 40·60 = 2400 s.","P = 1 981 625/2400 ≈ 825,7 ≈ 826 W."]},
{b:4,n:16,t:"Thả các quả cầu nóng vào bình nước",x:1,u:"quả",a:"21",
 q:"Bình cách nhiệt chứa nước ở 20 °C; thả lần lượt các quả cầu giống nhau đã đốt nóng tới 100 °C. Sau quả thứ nhất, nước nóng lên 40 °C. Cần thả tổng cộng bao nhiêu quả để nước đạt 90 °C?",
 h:"Gọi C là nhiệt dung của bình + nước; dùng quả 1 để tìm C theo c₀.",
 s:["Gọi C là nhiệt dung của bình + nước, c₀ là nhiệt dung của mỗi quả cầu.","Quả 1: c₀(100 − 40) = C(40 − 20) ⇒ 60c₀ = 20C ⇒ C = 3c₀.","Với n quả, cân bằng ở 90 °C: n·c₀(100 − 90) = C(90 − 20) ⇒ 10n·c₀ = 3c₀·70.","n = 210/10 = 21 quả."]},
{b:4,n:17,t:"Khối lượng thỏi đồng",u:"kg",a:"3,4",
 q:"Cung cấp 77 400 J làm một thỏi đồng nóng thêm 60 °C; c<sub>đồng</sub> = 380 J/kg.K. Tìm khối lượng thỏi đồng (kg, làm tròn đến hàng phần chục).",
 h:"m = Q/(cΔt).",
 s:["Q = mcΔt ⇒ m = Q/(cΔt) = 77 400/(380·60) = 77 400/22 800 ≈ 3,39 kg ≈ 3,4 kg."]},
{b:4,n:18,t:"Nhiệt dung riêng của nước từ số liệu",u:"J/(kg.K)",a:"4150",
 q:"Thùng chứa 15 kg nước, nóng từ 20 °C lên 70 °C cần 3,1125·10⁶ J. Tìm nhiệt dung riêng của nước.",
 h:"c = Q/(mΔt).",
 s:["Q = mcΔt ⇒ c = Q/(mΔt) = 3 112 500/(15·50) = 3 112 500/750 = 4150 J/(kg.K)."]},
/* ============ BÀI 5 ============ */

/* ---------------- Hình và bảng ---------------- */
function tbl(h,rows){return '<table class="data"><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>';}
/* vẽ đồ thị đường gấp khúc. o: pts [[x,y]], xmax, ymax, ymin, xl, yl, xt[] , yt[] (các mốc), alt, cap */
function plot(o){
  const W=420,H=230,L=50,R=16,T=18,B=34,pw=W-L-R,ph=H-T-B,y0=o.ymin||0;
  const X=x=>L+x/o.xmax*pw,Y=y=>T+ph-(y-y0)/(o.ymax-y0)*ph;
  const f=v=>String(v).replace('.',',');
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(o.alt||'Đồ thị')+'">';
  s+='<line x1="'+L+'" y1="'+(T+ph)+'" x2="'+(W-R)+'" y2="'+(T+ph)+'" stroke="currentColor"/><line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(T+ph)+'" stroke="currentColor"/>';
  (o.yt||[]).forEach(v=>{s+='<line x1="'+(L-4)+'" y1="'+Y(v)+'" x2="'+(W-R)+'" y2="'+Y(v)+'" stroke="#999" stroke-dasharray="3 3" opacity=".5"/><text x="'+(L-8)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="11" fill="currentColor">'+f(v)+'</text>';});
  (o.xt||[]).forEach(v=>{s+='<line x1="'+X(v)+'" y1="'+(T+ph)+'" x2="'+X(v)+'" y2="'+(T+ph+4)+'" stroke="currentColor"/><text x="'+X(v)+'" y="'+(T+ph+16)+'" text-anchor="middle" font-size="11" fill="currentColor">'+f(v)+'</text>';});
  s+='<polyline fill="none" stroke="#e2571f" stroke-width="2.5" points="'+o.pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')+'"/>';
  o.pts.forEach(p=>{s+='<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="3" fill="#2b6cb0"/>';});

function h53(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0,ch;i<s.length;i++){ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}

/* ====================== KIỂM TRA ĐÁP SỐ ====================== */
function num(str){return parseFloat(String(str).replace(',','.'))}
function decs(a){const p=String(a).split(',');return p[1]?p[1].length:0}
/* trích số từ ô nhập; trả về danh sách giá trị có thể hiểu được */
function parseAns(raw){
  let s=String(raw).replace(/[−–—]/g,'-').replace(/\s+/g,'');
  const m=s.match(/-?\d[\d.,]*/);if(!m)return [];
  let t=m[0].replace(/[.,]+$/,''),out=[];
  const dots=(t.match(/\./g)||[]).length,coms=(t.match(/,/g)||[]).length;
  if(dots&&coms){const li=Math.max(t.lastIndexOf('.'),t.lastIndexOf(','));out.push(parseFloat(t.slice(0,li).replace(/[.,]/g,'')+'.'+t.slice(li+1)))}
  else if(dots>1||coms>1){out.push(parseFloat(t.replace(/[.,]/g,'')))}
  else if(dots||coms){
    const sep=dots?'.':',',i=t.indexOf(sep);
    out.push(parseFloat(t.replace(',','.')));
    if(t.length-i-1===3)out.push(parseFloat(t.replace(sep,''))); /* 2.773 hoặc 2,773 có thể là hàng nghìn */
  } else out.push(parseFloat(t));
  return out.filter(v=>isFinite(v));
}
function isRight(q,raw){
  const a=num(q.a),tol=q.x?1e-9:Math.max(0.49*Math.pow(10,-decs(q.a)),0.002*Math.abs(a));
  return parseAns(raw).some(v=>Math.abs(v-a)<=tol+1e-9);
}

let VI=null;
function pickVi(){
  if(!("speechSynthesis" in window))return null;
  const vs=speechSynthesis.getVoices()||[];
  VI=vs.find(x=>/^vi([-_]|$)/i.test(x.lang))||vs.find(x=>/vietnam|tiếng việt|hoaimy|namminh/i.test(x.name))||null;
  return VI;
}
let ONERR=false;
function online(txt){
  try{
    const a=new Audio("https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=vi&q="+encodeURIComponent(txt.replace(/\./g,"")));
    a.onerror=()=>{ONERR=true;paintVoice()};
    a.play().catch(()=>{ONERR=true;paintVoice()});
  }catch(e){ONERR=true;paintVoice()}
}
function say(txt){
  if(!VOICE||!("speechSynthesis" in window))return;
  const ss=window.speechSynthesis;
  const speak=()=>{
    try{
      const v=pickVi();paintVoice();
      if(!v){online(txt);return} /* máy không có giọng tiếng Việt: dùng giọng online (chỉ 2 câu cố định) */
      ss.cancel();ss.resume();
      const u=new SpeechSynthesisUtterance(txt);u.lang=v.lang||"vi-VN";u.voice=v;u.rate=1;ss.speak(u);
    }catch(e){}
  };
  if((ss.getVoices()||[]).length)speak();
  else{let done=false;const once=()=>{if(done)return;done=true;speak()};ss.onvoiceschanged=once;setTimeout(once,700)}
}

function paintVoice(){
  const b=document.getElementById("voiceBtn");
  const warn=VOICE&&"speechSynthesis" in window&&(speechSynthesis.getVoices()||[]).length&&!VI&&ONERR;
  b.textContent=VOICE?(warn?"🔊 Giọng: Bật ⚠ không có giọng Việt":"🔊 Giọng: Bật"):"🔇 Giọng: Tắt";
  b.title=warn?"Thiết bị chưa cài giọng đọc tiếng Việt. Cài trong Cài đặt > Ngôn ngữ/Giọng nói (Windows) hoặc Cài đặt > Trợ năng > Chuyển văn bản thành giọng nói (Android/iOS).":"";
  b.setAttribute("aria-pressed",VOICE);
}

    h+='<div class="card wrong"><h3 style="margin-top:0">Các câu chưa đúng ('+todo.length+')</h3>'+(todo.length?'<div class="acts" style="margin:0 0 8px"><button class="btn" id="retryWrong">Làm lại các câu chưa đúng</button></div><ul>'+todo.map(q=>'<li><a data-jump="'+qid(q)+'">Bài '+q.b+' · Câu '+q.n+'</a> – '+q.t+(R(q).t?' (đã thử '+R(q).t+' lần)':' (chưa làm)')+'</li>').join("")+'</ul>':'<p>Bạn đã hoàn thành tất cả các câu. 🎉</p>')+'<div class="acts"><button class="btn alt" id="resetAll">Xóa toàn bộ kết quả</button></div></div>';
  } else {
    h+='<div class="card"><h2 style="margin-top:0">Bảng đáp án (giáo viên)</h2>'+(S.tShow===false?'<p>Đáp án đang ẩn (chế độ trình chiếu). Bấm <b>Đáp án</b> ở đầu trang để hiện bảng.</p>':BAI.map(g=>'<h3 style="color:'+g.c+'">Bài '+g.n+'. '+g.t+'</h3><table class="sum">'+Q.filter(q=>q.b===g.n).map(q=>'<tr><td style="width:90px"><b>Câu '+q.n+'</b></td><td>'+q.t+'</td><td style="width:200px"><b>'+q.a+(q.u?' '+q.u:'')+'</b></td></tr>').join("")+'</table>').join(""))+'</div>';
  }
  h+='<div class="card"><h3 style="margin-top:0">Bảng tóm tắt công thức trọng tâm</h3><table class="sum">'
   +'<tr><td><b>Nhiệt lượng thu/tỏa</b></td><td><span class="formula">Q = mcΔT</span> (c: nhiệt dung riêng, J/kg.K)</td></tr>'
   +'<tr><td><b>Nóng chảy / đông đặc</b></td><td><span class="formula">Q = λm</span> (nhiệt độ không đổi)</td></tr>'
   +'<tr><td><b>Hóa hơi / ngưng tụ</b></td><td><span class="formula">Q = Lm</span>; khi sôi nhiệt độ không đổi</td></tr>'
   +'<tr><td><b>Nguyên lí I</b></td><td><span class="formula">ΔU = A + Q</span> (A &gt; 0 khi nhận công, Q &gt; 0 khi nhận nhiệt)</td></tr>'
   +'<tr><td><b>Công khí khi p không đổi</b></td><td><span class="formula">|A| = pΔV</span></td></tr>'
   +'<tr><td><b>Cân bằng nhiệt</b></td><td><span class="formula">Q<sub>tỏa</sub> = Q<sub>thu</sub></span> (bỏ qua hao phí)</td></tr>'
   +'<tr><td><b>Công suất – hiệu suất</b></td><td><span class="formula">Q = Pt</span>, <span class="formula">H = Q<sub>ích</sub>/Q<sub>tp</sub></span></td></tr>'
   +'<tr><td><b>Thang nhiệt độ</b></td><td><span class="formula">T(K) = t(°C) + 273</span></td></tr></table></div>';
  view.innerHTML=h;
}
paintVoice();
openGate("student");
</script>
